[project]
name = "bot"
version = "0.1.0"
description = "Autonomous code-review engine — GitHub PR webhook -> LLM specialists -> PR comment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pygithub>=2.4",
    "google-genai>=0.3",
    "httpx>=0.27",
    "groq>=1.5.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "google-auth>=2.35",
    # Neither is imported directly by bot/ itself -- both are transitive via
    # pygithub. Declared explicitly anyway because bot/tests/test_github_app.py
    # imports `requests` directly (to patch PyGithub's own HTTP transport, per
    # that file's own module docstring), and pyjwt is kept pinned alongside it
    # for the same reason PyGithub needs it. See onboarding/pyproject.toml for
    # the one place either is imported by application code.
    "pyjwt>=2.13",
    "requests>=2.32",
    "python-multipart>=0.0.20",
]

[tool.uv]
package = false
