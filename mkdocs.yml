site_name: PR Review Engine
site_description: Autonomous code-review engine — deploy your own
docs_dir: guide
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Setup:
      - Overview: setup/index.md
      - 1. Prerequisites: setup/01-prerequisites.md
      - 2. Create the GitHub App: setup/02-github-app.md
      - 3. Install the App: setup/03-install-app.md
      - 4. Configure an LLM provider: setup/04-llm-provider.md
      - Local track:
          - 5. Get a Postgres: setup/local/05-postgres.md
          - 6. Start a tunnel: setup/local/06-tunnel.md
          - 7. Register the webhook: setup/local/07-webhook.md
          - 8. Run the service: setup/local/08-run.md
      - Hosted track:
          - 5. Create the Supabase project: setup/hosted/05-supabase.md
          - 6. Create the Render service: setup/hosted/06-render.md
          - 7. Sync config and verify: setup/hosted/07-sync.md
          - 8. Add the keep-warm pinger: setup/hosted/08-pinger.md
  - Operations:
      - Deploying and verifying: operations/deploy.md
      - Switching providers and keys: operations/overrides.md
      - Tuning cooldowns and usage caps: operations/tuning.md
      - Deploying an image: operations/image-deploys.md
      - Config files: operations/config-files.md
  - Reference:
      - Configuration: reference/config.md
      - Model pricing: reference/pricing.md
      - Deployment checks: reference/checks.md
      - What --sync-env pushes: reference/sync-env.md
