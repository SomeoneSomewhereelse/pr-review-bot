<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your own reviewer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1f2933;
    --text-muted: #5c6773;
    --border: #dde2e7;
    --accent: #3a6ea5;
    --ok: #2f7d4f;
    --fail: #b3454b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b;
      --surface: #1a1f26;
      --surface-2: #22282f;
      --text: #e6e9ec;
      --text-muted: #9aa5b1;
      --border: #2b323a;
      --accent: #7ba7d9;
      --ok: #5fbf87;
      --fail: #e08086;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #22282f;
    --text: #e6e9ec;
    --text-muted: #9aa5b1;
    --border: #2b323a;
    --accent: #7ba7d9;
    --ok: #5fbf87;
    --fail: #e08086;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
    min-height: 2.5rem;
  }
  button.control:hover { border-color: var(--accent); }
  .popup-backdrop { position: fixed; inset: 0; background: transparent; display: none; z-index: 10; }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; }
  p.lede { color: var(--text-muted); }
  details.frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }
  details.frame > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1.1rem;
  }
  details.frame[data-locked="true"] { opacity: 0.55; }
  details.frame[data-locked="true"] > summary { cursor: not-allowed; color: var(--text-muted); }
  details.frame[data-status="done"] > summary,
  details.frame[data-status="deploy_done"] > summary { cursor: default; color: var(--text); }
  details.frame > summary::-webkit-details-marker { display: none; }
  .frame-title { font-weight: 600; }
  .frame-badge { font-size: 0.85rem; color: var(--text-muted); }
  /* flex-basis: 100% forces this onto its own line below the title/badge/
     Change-button row, however long the detail text (an owner name, a URL)
     gets, instead of wrapping and pushing the Change button down with it. */
  .frame-detail { flex-basis: 100%; font-size: 0.85rem; color: var(--text-muted); }
  details.frame[data-status="done"] .frame-badge,
  details.frame[data-status="done"] .frame-detail,
  details.frame[data-status="deploy_done"] .frame-badge,
  details.frame[data-status="deploy_done"] .frame-detail { color: var(--ok); }
  details.frame[data-status="error"] .frame-badge,
  details.frame[data-status="error"] .frame-detail { color: var(--fail); }
  details.frame[data-status="app_created"] .frame-badge,
  details.frame[data-status="app_created"] .frame-detail,
  details.frame[data-status="choosing_org"] .frame-badge,
  details.frame[data-status="choosing_org"] .frame-detail,
  details.frame[data-status="checking"] .frame-badge,
  details.frame[data-status="checking"] .frame-detail,
  details.frame[data-status="provisioning"] .frame-badge,
  details.frame[data-status="provisioning"] .frame-detail,
  details.frame[data-status="deploying"] .frame-badge,
  details.frame[data-status="deploying"] .frame-detail { color: var(--accent); }
  .frame-change {
    display: none;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  details.frame[data-status="done"] .frame-change { display: inline-block; }
  .frame-body { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
  .frame-body input[type="password"], .frame-body input[type="text"], .frame-body select {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    min-height: 2.5rem;
  }
  .frame-body button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  /* Password input with the reveal control sitting inside it. The container
     owns the vertical spacing and the input's own margin is zeroed, so the
     absolutely positioned button can stretch top-to-bottom and centre its
     icon without depending on where that margin lands. Logical properties
     (inset-inline-end / padding-inline-end) put the control on the correct
     side automatically under the Hebrew RTL direction. */
  .frame-body .password-field { position: relative; margin: 0.5rem 0; }
  .frame-body .password-field input { margin: 0; padding-inline-end: 2.75rem; }
  .frame-body .password-toggle {
    position: absolute;
    inset-inline-end: 0.35rem;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    min-height: 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .frame-body .password-toggle:hover { color: var(--text); }
  .frame-body .password-toggle svg { width: 1.15rem; height: 1.15rem; display: block; }
  .frame-body .password-toggle svg[hidden] { display: none; }
  .frame-body button.copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    min-height: 0;
    margin-inline-start: 0.35rem;
    padding: 0;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
    vertical-align: middle;
  }
  .frame-body button.copy-btn:hover { color: var(--text); background: var(--surface-2); }
  .frame-body button.copy-btn.copied { color: var(--ok); }
  .copy-btn svg { width: 1rem; height: 1rem; display: block; }
  .copy-btn svg[hidden] { display: none; }
  .copy-wrap { position: relative; display: inline-block; }
  .copy-tooltip {
    position: absolute;
    bottom: calc(100% + 0.3rem);
    inset-inline-start: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    font-size: 0.75rem;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
    pointer-events: none;
    z-index: 1;
  }
  :dir(rtl) .copy-tooltip { transform: translateX(50%); }
  .copy-tooltip.show { opacity: 1; visibility: visible; }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }
  .checkbox-row input[type="checkbox"] { margin: 0.15rem 0 0; flex: none; }
  .frame-error { color: var(--fail); min-height: 1.2em; }
  @media (max-width: 480px) {
    header.topbar { justify-content: center; }
    details.frame > summary { padding: 0.75rem 0.9rem; }
    .frame-change { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button id="wizard-reset-button" class="control" type="button" data-i18n="reset_wizard_button"></button>
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog" aria-label="Theme"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog" aria-label="Language"></button>
  </header>

  <dialog id="wizard-reset-confirm-dialog">
    <p data-i18n="reset_wizard_confirm_text"></p>
    <button id="wizard-reset-confirm-yes" type="button" data-i18n="reset_wizard_confirm_yes"></button>
    <button id="wizard-reset-confirm-no" type="button" data-i18n="reset_wizard_confirm_no"></button>
  </dialog>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> 🇺🇸 English</label>
        <label><input type="radio" name="lang" value="he"> 🇮🇱 עברית</label>
      </div>
    </div>
  </div>

  <main>
    <h1 data-i18n="heading"></h1>
    <p class="lede" data-i18n="lede"></p>

    <details id="frame-render-key" class="frame" data-status="ready" data-locked="false" open>
      <summary>
        <span class="frame-title" data-i18n="frame1_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-key" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame1_instructions"></p>
        <input id="render-key-input" type="password" autocomplete="off">
        <button id="render-key-submit" type="button" data-i18n="validate_button"></button>
        <p id="render-key-error" class="frame-error" aria-live="polite"></p>
      </div>
    </details>

    <details id="frame-render-service" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame_render_service_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-service" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame_render_service_instructions"></p>
        <label data-i18n="frame_render_service_repo_label"></label>
        <input id="render-service-repo-input" type="text">
        <label data-i18n="frame_render_service_name_label"></label>
        <input id="render-service-name-input" type="text">
        <button id="render-service-submit" type="button" data-i18n="create_service_button"></button>
        <p id="render-service-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-dashboard-auth" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame_dashboard_auth_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="dashboard-auth" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame_dashboard_auth_instructions"></p>
        <label data-i18n="frame_dashboard_auth_username_label"></label>
        <input id="dashboard-auth-username-input" type="text" autocomplete="off">
        <label data-i18n="frame_dashboard_auth_password_label"></label>
        <div class="password-field">
          <input id="dashboard-auth-password-input" type="password" autocomplete="off">
          <button id="dashboard-auth-password-toggle" class="password-toggle" type="button">
            <svg id="dashboard-auth-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="dashboard-auth-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <button id="dashboard-auth-generate-submit" type="button" data-i18n="generate_password_button"></button>
        <button id="dashboard-auth-submit" type="button" data-i18n="save_continue_button"></button>
        <label class="checkbox-row">
          <input id="dashboard-auth-ack-checkbox" type="checkbox">
          <span data-i18n="dashboard_auth_ack_label"></span>
        </label>
        <p id="dashboard-auth-error" class="frame-error" aria-live="polite"></p>
      </div>
    </details>

    <details id="frame-github-app" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame2_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="github-app" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame2_instructions"></p>
        <ol>
          <li data-i18n="frame2_step_create"></li>
          <li><span data-i18n="frame2_step_homepage_url"></span> <code id="github-app-homepage-url"></code></li>
          <li><span data-i18n="frame2_step_webhook_url"></span> <code id="github-app-webhook-url"></code><span class="copy-wrap"><button id="github-app-webhook-url-copy" class="copy-btn" type="button" data-copy-target="github-app-webhook-url">
              <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="13" height="13" rx="2"/>
                <rect x="8" y="8" width="13" height="13" rx="2"/>
              </svg>
              <svg class="copy-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button><span class="copy-tooltip" role="status" aria-hidden="true"></span></span></li>
          <li><span data-i18n="frame2_step_webhook_secret"></span> <code id="github-app-webhook-secret"></code><span class="copy-wrap"><button id="github-app-webhook-secret-copy" class="copy-btn" type="button" data-copy-target="github-app-webhook-secret">
              <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="13" height="13" rx="2"/>
                <rect x="8" y="8" width="13" height="13" rx="2"/>
              </svg>
              <svg class="copy-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button><span class="copy-tooltip" role="status" aria-hidden="true"></span></span></li>
          <li>
            <span data-i18n="frame2_step_permissions"></span>
            <table>
              <thead><tr><th data-i18n="frame2_permission_col"></th><th data-i18n="frame2_access_col"></th></tr></thead>
              <tbody id="github-app-permissions-table-body"></tbody>
            </table>
          </li>
          <li data-i18n="frame2_step_events"></li>
          <li data-i18n="frame2_step_private"></li>
          <li data-i18n="frame2_step_install"></li>
        </ol>
        <label data-i18n="frame2_app_id_label"></label>
        <input id="github-app-id-input" type="text" inputmode="numeric" autocomplete="off">
        <label data-i18n="frame2_private_key_label"></label>
        <input id="github-app-key-file-input" type="file" accept=".pem,application/x-pem-file">
        <button id="github-app-validate-submit" type="button" data-i18n="validate_button"></button>
        <ul id="github-app-checklist"></ul>
        <p id="github-app-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-supabase" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame3_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="supabase" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="supabase-connect-section">
          <p data-i18n="frame3_instructions"></p>
          <input id="supabase-key-input" type="password" autocomplete="off">
          <button id="supabase-key-submit" type="button" data-i18n="validate_supabase_key_button"></button>
        </div>
        <div id="supabase-org-section" style="display: none;">
          <p data-i18n="frame3_org_instructions"></p>
          <select id="supabase-org-select"></select>
          <input id="supabase-project-name-input" type="text">
          <button id="supabase-org-submit" type="button" data-i18n="create_project_button"></button>
        </div>
        <div id="supabase-provisioning-section" style="display: none;">
          <p data-i18n="frame3_provisioning"></p>
          <button id="supabase-check-status-submit" type="button" data-i18n="check_again_button" style="display: none;"></button>
        </div>
        <p id="supabase-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-llm-provider" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame4_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="llm-provider" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame4_instructions"></p>
        <div class="radio-group">
          <label><input type="radio" name="llm-provider-choice" value="gemini" id="llm-provider-choice-gemini"> <span data-i18n="frame4_provider_gemini"></span></label>
          <label><input type="radio" name="llm-provider-choice" value="groq" id="llm-provider-choice-groq"> <span data-i18n="frame4_provider_groq"></span></label>
          <label><input type="radio" name="llm-provider-choice" value="vertex" id="llm-provider-choice-vertex"> <span data-i18n="frame4_provider_vertex"></span></label>
        </div>
        <input id="llm-provider-api-key-input" type="password" style="display: none;">
        <input id="llm-provider-file-input" type="file" accept="application/json" style="display: none;">
        <button id="llm-provider-validate-submit" type="button" data-i18n="validate_button" style="display: none;"></button>
        <div id="llm-provider-model-section" style="display: none;">
          <p data-i18n="frame4_model_instructions"></p>
          <select id="llm-provider-model-select"></select>
          <button id="llm-provider-continue-submit" type="button" data-i18n="continue_button"></button>
        </div>
        <p id="llm-provider-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-uptime-pinger" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame5_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="uptime-pinger" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="uptime-pinger-blocked-section">
          <p data-i18n="frame5_blocked_no_render_url"></p>
        </div>
        <div id="uptime-pinger-form-section" style="display: none;">
          <p data-i18n="frame5_instructions"></p>
          <input id="uptime-pinger-api-key-input" type="password">
          <button id="uptime-pinger-submit" type="button" data-i18n="validate_button"></button>
        </div>
        <p id="uptime-pinger-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-render-deploy" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame6_title"></span>
        <span class="frame-badge"></span>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="render-deploy-trigger-section">
          <p data-i18n="frame6_instructions"></p>
          <button id="render-deploy-trigger-submit" type="button" data-i18n="deploy_button"></button>
        </div>

      err_llm_unreachable: "הספק אינו זמין כרגע. נסו שוב בעוד רגע.",
      err_llm_no_models_available: "פרטי ההתחברות תקינים, אך אין מודלים זמינים לשימוש. ודאו שיש לחשבון/לפרויקט שלכם מודל מתאים מופעל.",

      frame5_blocked_no_render_url: "השלימו קודם את פריסת ה-Render שלכם — שלב זה זקוק לכתובת ה-URL שלה.",
      err_uptime_empty_key: "הדביקו קודם את מפתח ה-API של UptimeRobot.",
      err_uptime_unauthorized: "המפתח נדחה. שימו לב: מפתח Monitor-Specific לא יעבוד כאן — השתמשו במפתח הראשי (Main API Key) מתוך My Settings ← API Keys ב-UptimeRobot.",
      err_uptime_rate_limited: "יותר מדי בקשות ל-UptimeRobot כרגע. נסו שוב בעוד רגע.",
      err_uptime_unreachable: "UptimeRobot אינו זמין כרגע. נסו שוב בעוד רגע.",
      err_uptime_request_rejected: "UptimeRobot דחה את הבקשה. נסו שוב בעוד רגע.",
      monitor_created_detail: "הפינגר נוצר",
      monitor_reused_detail: "נעשה שימוש בפינגר קיים",
    },
  };

  const THEME_ICON = { light: "☀️", dark: "🌙", system: "🖥️" };
  const LANG_LABEL = { en: "🇺🇸 English", he: "🇮🇱 עברית" };

  const KNOWN_LANGS = ["en", "he"];
  const KNOWN_THEMES = ["light", "dark", "system"];

  function readStoredLang() {
    const stored = localStorage.getItem("onboarding_lang");
    return KNOWN_LANGS.includes(stored) ? stored : "en";
  }

  function readStoredTheme() {
    const stored = localStorage.getItem("onboarding_theme");
    return KNOWN_THEMES.includes(stored) ? stored : "system";
  }

  let currentLang = readStoredLang();
  let currentTheme = readStoredTheme();

  function t(key) {
    return STRINGS[currentLang][key] || STRINGS.en[key] || key;
  }

  function applyTheme(theme) {
    currentTheme = theme;
    localStorage.setItem("onboarding_theme", theme);
    document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
    document.getElementById("themeToggleBtn").textContent = `${THEME_ICON[theme]} ${t("theme_" + theme)}`;
    document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
  }

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("onboarding_lang", lang);
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
    document.title = t("page_title");
    document.getElementById("langToggleBtn").textContent = LANG_LABEL[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.getElementById("render-key-input").placeholder = t("frame1_placeholder");
    document.getElementById("supabase-project-name-input").placeholder = t("frame3_name_placeholder");
    document.getElementById("themePopupTitle").textContent = t("theme_popup_title");
    document.getElementById("langPopupTitle").textContent = t("lang_popup_title");
    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
    refreshFrameBadges();
    if (currentRenderKeyErrorKey) {
      document.getElementById("render-key-error").textContent = t(currentRenderKeyErrorKey);
    }
    if (currentRenderServiceErrorKey) {
      document.getElementById("render-service-error").textContent = t(currentRenderServiceErrorKey);
    }
    if (currentDashboardAuthErrorKey) {
      document.getElementById("dashboard-auth-error").textContent = t(currentDashboardAuthErrorKey);
    }
    // Re-applies the toggle's aria-label/title in the new language; the
    // function is the single place that string is resolved.
    setDashboardAuthPasswordVisibility(dashboardAuthPasswordVisible);
    refreshCopyButtonLabels();
    if (currentRenderDeployErrorKey) {
      document.getElementById("render-deploy-error").textContent = t(currentRenderDeployErrorKey);
    }
    if (currentGithubAppErrorKey) {
      document.getElementById("github-app-error").textContent = t(currentGithubAppErrorKey);
    }
    if (currentSupabaseErrorKey) {
      document.getElementById("supabase-error").textContent = t(currentSupabaseErrorKey);
    }
    if (currentLlmProviderErrorKey) {
      document.getElementById("llm-provider-error").textContent = t(currentLlmProviderErrorKey);
    }
    if (currentUptimePingerErrorKey) {
      document.getElementById("uptime-pinger-error").textContent = t(currentUptimePingerErrorKey);
    }
    applyTheme(currentTheme);
  }

  // Every value stored under these keys is non-secret continuity/display
  // state for the current page view only (a URL, an id, a provider/model
  // choice, a "completed" flag) -- never a credential. Credentials live
  // server-side now (session_store.py, keyed by the onboarding_session
  // cookie); GET /api/session (restoreFromSession()) is the source of
  // truth for what's already done, not sessionStorage. There is
  // deliberately no "render-key" or "github-app" entry here anymore: the
  // Render API key is never resent after frame 1 validates it, and the
  // GitHub App credentials are never resent after frame 2 validates them
  // (see onboarding/CLAUDE.md's credential-handling rules for this file).
  const STORAGE_KEYS = {
    "render-service": "onboarding.renderService",
    "dashboard-auth": "onboarding.dashboardAuth",
    "supabase": "onboarding.supabase",
    "llm-provider": "onboarding.llmProvider",
    "uptime-pinger": "onboarding.uptimeRobot",
  };

  // Written by the render-deploy frame on its own completion -- frame 5
  // only ever reads this key, never writes it. See
  // docs/superpowers/specs/2026-08-27-onboarding-uptimerobot-frame-design.md
  // section 3's forward contract.
  const RENDER_SERVICE_URL_KEY = "onboarding.renderServiceUrl";

  // Same defensive shape as readStoredLang/readStoredTheme above -- a
  // corrupted/foreign-shaped stored value must never throw out of a
  // handler (including DOMContentLoaded, which would take every later
  // listener with it).
  function readStoredSupabase() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["supabase"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // Same defensive shape as readStoredSupabase() above.
  function readStoredRenderService() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["render-service"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // SOURCE OF TRUTH: bot/scripts/create_github_app.py's MANIFEST_PERMISSIONS /
  // MANIFEST_EVENTS. These two lists must stay identical -- the CLI script's
  // manifest and this wizard's validation checklist both describe the same
  // requirement. Change them there first, then here;
  // tests/test_onboarding_page.py::test_required_permissions_match_the_cli_script
  // imports the Python constants and fails if these drift.
  const REQUIRED_PERMISSIONS = {
    pull_requests: "write", contents: "read", issues: "write", metadata: "read",
  };
  const REQUIRED_EVENTS = ["pull_request"];

  const FRAME_ORDER = [
    "render-key", "render-service", "dashboard-auth", "github-app", "supabase",
    "llm-provider", "uptime-pinger", "render-deploy",
  ];

  const frameState = {};
  FRAME_ORDER.forEach((id) => { frameState[id] = {status: "locked", detailKey: null, detailValue: null}; });
  frameState["render-key"].status = "ready";

  let currentRenderKeyErrorKey = null;
  let currentGithubAppErrorKey = null;
  let currentSupabaseErrorKey = null;
  let currentDashboardAuthErrorKey = null;
  let dashboardAuthPasswordVisible = false;

  // Bumped every time the Supabase frame is reset (lockFrame, beginChange,
  // or a terminal error) -- a poll started before the bump checks its
  // captured value against the current one and stops applying results if
  // they've diverged, instead of a stale setTimeout callback overwriting a
  // freshly reset frame's state after the visitor changed an upstream
  // frame mid-poll.
  let supabasePollGeneration = 0;
  // Same pattern as supabasePollGeneration above, for the render-deploy
  // frame's own poll loop.
  let renderDeployPollGeneration = 0;

  function frameEl(id) {
    return document.getElementById(`frame-${id}`);
  }

  function badgeEl(id) {
    return frameEl(id).querySelector(".frame-badge");
  }

  function detailEl(id) {
    return frameEl(id).querySelector(".frame-detail");
  }

  function renderBadge(id) {
    const {status, detailKey, detailValue} = frameState[id];
    const label = t("badge_" + status);
    // t() falls back to returning its input unchanged when it isn't a known
    // STRINGS key (see t()'s own `|| key` fallback), so resolving detailValue
    // through it here is safe for every existing caller that passes raw,
    // non-translatable text (a URL, an owner/account/project name) -- only a
    // detailValue that is itself a STRINGS key (e.g. a provider label key)
    // gets translated, and it re-resolves on every render, including after a
    // language switch.
    const detail = detailKey ? `${t(detailKey)}${detailValue ? t(detailValue) : ""}` : "";
    // Split across two elements, not one: the short label stays in the top
    // row next to the title and Change button, while the detail (which can
    // be arbitrarily long -- a URL, an owner name) renders on its own line
    // below via .frame-detail's flex-basis: 100%, instead of wrapping inline
    // and pushing the Change button down with it.
    badgeEl(id).textContent = label;
    detailEl(id).textContent = detail ? `— ${detail}` : "";
  }

  function refreshFrameBadges() {
    FRAME_ORDER.forEach(renderBadge);
  }

  function setFrameStatus(id, status, detailKey, detailValue) {
    frameState[id] = {status, detailKey: detailKey || null, detailValue: detailValue ?? null};
    frameEl(id).dataset.status = status;
    renderBadge(id);
  }

  function nextFrame(id) {
    return FRAME_ORDER[FRAME_ORDER.indexOf(id) + 1];
  }

  // Deletes the server-side session (session_store.py) and clears the
  // cookie, then reloads -- restoreFromSession() on the fresh load sees a
  // brand-new visitor. Does not undo anything already created externally
  // (GitHub App, Supabase project, Render service); the confirm dialog
  // says so.
  async function resetWizard() {
    document.getElementById("wizard-reset-confirm-dialog").close();
    try {
      await fetch("/api/session/reset", {method: "POST"});
    } catch (err) {
      // best-effort -- proceed to reload regardless, the cookie is
      // cleared client-side by the response when it does arrive; a
      // network failure here just means a stale session row lingers
      // server-side until its TTL expires.
    }
    location.reload();
  }

  function lockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "locked");
    const key = STORAGE_KEYS[id];
    if (key) sessionStorage.removeItem(key);
    // Frame 2's create/install sections are a one-way toggle otherwise: the
    // storage clear above would leave "Install App" on screen with nothing
    // behind it, and clicking it would report a misleading GitHub error.
    // Frame 3's connect/org-picker/provisioning sections are the same
    // shape, one step longer.
    if (id === "dashboard-auth") resetDashboardAuthSection();
    if (id === "github-app") resetGithubAppSetupSection();
    if (id === "supabase") resetSupabaseConnectSection();
    if (id === "llm-provider") resetLlmProviderSection();
    if (id === "uptime-pinger") resetUptimePingerSection();
    if (id === "render-deploy") {
      resetRenderDeploySection();
      // deployed/pending_deploy_id live inside render-service's own storage
      // blob (see finishRenderDeploy/triggerRenderDeploy), not a
      // "render-deploy" key of their own -- STORAGE_KEYS has no entry for
      // this frame, so the generic removeItem above never touches them.
      // Without this, a reload after locking this frame (e.g. right after
      // changing llm-provider, before redeploying) would have
      // restoreFromSession() resurrect the OLD deploy's live-URL/polling
      // state from the still-present flags, even though a fresh redeploy is
      // actually required. service_id/service_url are left alone -- they're
      // still valid; only render-service's own lockFrame call (a separate,
      // rarer case) should ever clear those.
      const renderServiceState = readStoredRenderService();
      if (renderServiceState) {
        delete renderServiceState.deployed;
        delete renderServiceState.pending_deploy_id;
        sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(renderServiceState));
      }
    }
    if (id === "render-service") {
      sessionStorage.removeItem(RENDER_SERVICE_URL_KEY);
      document.getElementById("render-service-submit").disabled = false;
    }
  }

  function unlockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "false";
    el.open = true;
    setFrameStatus(id, "ready");
    if (id === "uptime-pinger") refreshUptimePingerBlockedState();
    if (id === "render-service") prefillRenderServiceDefaults();
    if (id === "github-app") renderGithubAppInstructions();
  }

  // Structural dependency graph -- NOT wizard display order -- naming which
  // frames' already-submitted data becomes stale when a given frame's data
  // changes. Precomputed transitive closure (render-key's entry already
  // includes everything render-service's own entry lists), so
  // relockDownstreamOf is a plain lookup, not a graph walk.
  //
  //  - render-key's api_key is used to create/look up the Render service
  //    (render-service) and to push env vars / trigger a deploy
  //    (render-deploy) -- a different key likely means a different Render
  //    account, so both are invalidated.
  //  - render-service's service_id/service_url are consumed by github-app
  //    (the webhook URL the visitor pastes into GitHub) and uptime-pinger
  //    (the URL the monitor watches), plus render-deploy (needs service_id).
  //  - dashboard-auth/github-app/supabase/llm-provider each only feed the
  //    final bulk env-var push (bulk_push_render_env_vars) -- nothing else
  //    reads their data, so changing one only invalidates render-deploy.
  //    This is the concrete case that motivated this map over the old
  //    "everything positioned after id" rule: llm-provider sits before
  //    uptime-pinger on the page, but uptime-pinger doesn't consume
  //    anything llm-provider produces, so changing the LLM provider must
  //    not force the visitor to redo the uptime monitor too.
  //  - uptime-pinger's own data (the UptimeRobot monitor) is never part of
  //    the Render env-var push and nothing downstream reads it -- changing
  //    it invalidates nothing else, not even render-deploy.
  const FRAME_DEPENDENTS = {
    "render-key": ["render-service", "github-app", "uptime-pinger", "render-deploy"],
    "render-service": ["github-app", "uptime-pinger", "render-deploy"],
    "dashboard-auth": ["render-deploy"],
    "github-app": ["render-deploy"],
    "supabase": ["render-deploy"],
    "llm-provider": ["render-deploy"],
    "uptime-pinger": [],
    "render-deploy": [],
  };

  function relockDownstreamOf(id) {
    (FRAME_DEPENDENTS[id] || []).forEach(lockFrame);
  }

  // Everything the final bulk env-var push (bulk_push_render_env_vars)
  // actually reads from the session -- deliberately excludes uptime-pinger,
  // which contributes nothing to that push (see FRAME_DEPENDENTS above).
  const RENDER_DEPLOY_PREREQS = [
    "render-key", "render-service", "dashboard-auth", "github-app", "supabase", "llm-provider",
  ];

  // Set once render-deploy completes for the first time (finishRenderDeploy,
  // or restoreFromSession() resuming an already-deployed session) -- gates
  // maybeUnlockRenderDeployAfterRedo below so it only ever acts on a REDO,
  // never the wizard's first pass. On a first pass, render-deploy must stay
  // gated behind uptime-pinger's own completion (the plain nextFrame chain
  // below already does that) -- an early per-prereq unlock would let a
  // first-time visitor reach "Deploy" while uptime-pinger, sitting earlier
  // on the page, is still unfilled.
  let renderDeployCompletedOnce = false;

  // After the wizard has completed once, changing an earlier frame relocks
  // only its real dependents (FRAME_DEPENDENTS), which can leave
  // render-deploy locked with no frame between the one just resubmitted and
  // it in FRAME_ORDER (e.g. resubmitting llm-provider -- its next positional
  // frame is uptime-pinger, not render-deploy). This re-checks readiness
  // directly instead of relying on positional order: once every real
  // prerequisite is done again, render-deploy unlocks regardless of where
  // it sits in the page.
  function maybeUnlockRenderDeployAfterRedo(completedId) {
    if (!renderDeployCompletedOnce) return;
    if (!(FRAME_DEPENDENTS[completedId] || []).includes("render-deploy")) return;
    if (frameEl("render-deploy").dataset.locked !== "true") return;
    if (!RENDER_DEPLOY_PREREQS.every((pid) => frameState[pid].status === "done")) return;
    unlockFrame("render-deploy");
  }

  function completeFrame(id, detailKey, detailValue, status, keepOpen) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    if (!keepOpen) el.open = false;
    setFrameStatus(id, status || "done", detailKey, detailValue);
    // Only unlock the next positional frame if it's genuinely blocked
    // ("locked" -- never yet reached, or relocked by this redo). On a redo,
    // the next frame in FRAME_ORDER is often one that was never relocked at
    // all (relockDownstreamOf now only relocks real dependents, not
    // everything positioned after id) and must be left exactly as it was --
    // re-unlocking an already-"done" frame would wrongly reopen it and
    // reset its badge to "Not started".
    const next = nextFrame(id);
    if (next && frameState[next].status === "locked") unlockFrame(next);
    if (id !== "render-deploy") maybeUnlockRenderDeployAfterRedo(id);
  }

  // Best-effort cleanup for an UptimeRobot monitor left watching a Render
  // service URL that's about to stop existing. Only render-key and
  // render-service changes can invalidate render-service's URL (every
  // other frame's "Change" leaves it alone) -- called from beginChange.
  // Session-backed (no body): the UptimeRobot API key lives server-side
  // now, not in sessionStorage, so there's nothing local left to gate this
  // on -- the endpoint itself reports back if there's no session record to
  // clean up.
  async function cleanupOrphanedUptimeMonitor() {
    try {
      const resp = await fetch("/api/uptimerobot/delete-monitor", {method: "POST"});
      const body = await resp.json();
      if (!body.valid) {
        console.warn("UptimeRobot monitor cleanup failed:", "/api/uptimerobot/delete-monitor", "reason:", body.reason);
      }
    } catch (err) {
      // best-effort -- a network failure here never blocks the frame
      // change it was triggered by.
      console.warn("UptimeRobot monitor cleanup failed:", "/api/uptimerobot/delete-monitor", "network error");
    }
  }

  function beginChange(id) {
    if (id === "render-key" || id === "render-service") {
      cleanupOrphanedUptimeMonitor();
    }
    relockDownstreamOf(id);
    const el = frameEl(id);
    el.dataset.locked = "false";
    el.open = true;
    setFrameStatus(id, "ready");
    // relockDownstreamOf only clears *later* frames' local storage, so a
    // frame changing itself must clear its own stale value here too —
    // otherwise a mid-change refresh would silently re-complete it from
    // stale local state before the visitor resubmits. Every frame below
    // clears its own key on self-change for exactly this reason. Note this
    // only clears the LOCAL mirror -- the server-side session still has
    // the frame's previous data until it's resubmitted (session_store.py
    // has no partial-frame-clear endpoint); a reload right after clicking
    // "Change" but before resubmitting would restore the old value from
    // GET /api/session. Accepted as a minor, recoverable edge case rather
    // than adding a new endpoint for it.
    if (id === "render-key") {
      document.getElementById("render-key-submit").disabled = false;
    }
    if (id === "render-service") {
      sessionStorage.removeItem(STORAGE_KEYS["render-service"]);
      sessionStorage.removeItem(RENDER_SERVICE_URL_KEY);
      document.getElementById("render-service-name-input").value = "";
      document.getElementById("render-service-submit").disabled = false;
      prefillRenderServiceDefaults();
    }
    if (id === "dashboard-auth") {
      sessionStorage.removeItem(STORAGE_KEYS["dashboard-auth"]);
      resetDashboardAuthSection();
    }
    if (id === "github-app") {
      resetGithubAppSetupSection();
      renderGithubAppInstructions();
    }
    if (id === "supabase") {
      sessionStorage.removeItem(STORAGE_KEYS["supabase"]);
      resetSupabaseConnectSection();
    }
    if (id === "llm-provider") {

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        const commaIdx = result.indexOf(",");
        resolve(commaIdx >= 0 ? result.slice(commaIdx + 1) : result);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function base64ToJsonSanityCheck(b64) {
    try {
      const decoded = atob(b64);
      JSON.parse(decoded);
      return true;
    } catch (err) {
      return false;
    }
  }

  async function validateLlmProviderCredential() {
    const provider = getSelectedLlmProvider();
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    pendingLlmProviderCredential = null;
    if (!provider) {
      llmProviderError("err_llm_no_provider");
      return;
    }
    let endpoint, payload, credentialFragment;
    if (provider === "gemini") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/gemini/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else if (provider === "groq") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/groq/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else {
      const fileInput = document.getElementById("llm-provider-file-input");
      const file = fileInput.files[0];
      if (!file) {
        llmProviderError("err_llm_no_file");
        return;
      }
      let b64;
      try {
        b64 = await readFileAsBase64(file);
      } catch (err) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      if (!(await base64ToJsonSanityCheck(b64))) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      endpoint = "/api/llm/vertex/list-models";
      payload = {service_account_key_b64: b64};
      credentialFragment = {gcp_service_account_key_b64: b64};
    }
    setFrameStatus("llm-provider", "checking");
    document.getElementById("llm-provider-validate-submit").disabled = true;
    let resp;
    try {
      resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
    } catch (err) {
      llmProviderError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      llmProviderError("err_llm_unreachable");
      return;
    }
    if (!body.valid) {
      llmProviderErrorForReason(body.reason);
      return;
    }
    showLlmProviderModels(body.models, provider, credentialFragment, body.project_id);
  }

  function generateDashboardAuthPassword() {
    const bytes = crypto.getRandomValues(new Uint8Array(15));
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  // 32 random bytes, base64url-encoded -- comfortably over app/main.py's own
  // `len(dashboard_session_secret) >= 32` boot guard. Never shown to the
  // visitor (unlike username/password): nothing downstream ever asks them
  // to type it again.
  function generateDashboardAuthSessionSecret() {
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function setDashboardAuthPasswordVisibility(visible) {

  // Timers per copy-button id, so a second click before the "Copied!" state
  // reverts doesn't leave a stale timeout racing a fresh one.
  const copyButtonRevertTimers = {};

  function setCopyButtonLabel(button) {
    button.setAttribute("aria-label", t("copy_button"));
    button.setAttribute("title", t("copy_button"));
  }

  function refreshCopyButtonLabels() {
    document.querySelectorAll(".copy-btn").forEach((button) => {

    });

  async function copyValueToClipboard(button) {
    const targetId = button.getAttribute("data-copy-target");
    const value = document.getElementById(targetId).textContent;
    try {
      await navigator.clipboard.writeText(value);
    } catch {
      return;
    }
    if (copyButtonRevertTimers[targetId]) clearTimeout(copyButtonRevertTimers[targetId]);
    const tooltip = button.parentElement.querySelector(".copy-tooltip");
    button.classList.add("copied");
    button.setAttribute("aria-label", t("copy_button_copied"));
    button.setAttribute("title", t("copy_button_copied"));
    button.querySelector(".copy-icon").hidden = true;
    button.querySelector(".copy-check").hidden = false;
    tooltip.textContent = t("copy_button_copied");
    tooltip.classList.add("show");
    copyButtonRevertTimers[targetId] = setTimeout(() => {
      button.classList.remove("copied");
      setCopyButtonLabel(button);
      button.querySelector(".copy-icon").hidden = false;
      button.querySelector(".copy-check").hidden = true;
      tooltip.classList.remove("show");
    }, 2500);
  }

  async function submitDashboardAuth() {
    const usernameInput = document.getElementById("dashboard-auth-username-input");
    const passwordInput = document.getElementById("dashboard-auth-password-input");
    const ackCheckbox = document.getElementById("dashboard-auth-ack-checkbox");
    const errorEl = document.getElementById("dashboard-auth-error");
    errorEl.textContent = "";
    currentDashboardAuthErrorKey = null;
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_empty";
      errorEl.textContent = t("err_dashboard_auth_empty");
      return;
    }
    if (password.length < 8) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_password_short";
      errorEl.textContent = t("err_dashboard_auth_password_short");
      return;
    }
    if (!ackCheckbox.checked) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_ack_required";
      errorEl.textContent = t("err_dashboard_auth_ack_required");
      return;
    }
    const submitBtn = document.getElementById("dashboard-auth-submit");
    submitBtn.disabled = true;
    const sessionSecret = generateDashboardAuthSessionSecret();
    let resp, body;
    try {
      resp = await fetch("/api/dashboard-auth/confirm", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, session_secret: sessionSecret}),
      });
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      submitBtn.disabled = false;
      currentDashboardAuthErrorKey = "err_network";
      errorEl.textContent = t("err_network");
      return;
    }
    if (!body.valid) {
      submitBtn.disabled = false;
      currentDashboardAuthErrorKey = body.reason === "no_session" ? "err_no_session" : "err_dashboard_auth_storage_failed";
      errorEl.textContent = t(currentDashboardAuthErrorKey);
      return;
    }
    try {
      sessionStorage.setItem(STORAGE_KEYS["dashboard-auth"], JSON.stringify({completed: true}));
    } catch (err) {
      // best-effort -- the frame still completes this page view even if
      // the local mirror can't be written.
    }
    completeFrame("dashboard-auth", null, null);
  }
