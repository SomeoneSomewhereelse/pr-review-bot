<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your own reviewer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1f2933;
    --text-muted: #5c6773;
    --border: #dde2e7;
    --accent: #3a6ea5;
    --ok: #2f7d4f;
    --fail: #b3454b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b;
      --surface: #1a1f26;
      --surface-2: #22282f;
      --text: #e6e9ec;
      --text-muted: #9aa5b1;
      --border: #2b323a;
      --accent: #7ba7d9;
      --ok: #5fbf87;
      --fail: #e08086;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #22282f;
    --text: #e6e9ec;
    --text-muted: #9aa5b1;
    --border: #2b323a;
    --accent: #7ba7d9;
    --ok: #5fbf87;
    --fail: #e08086;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
    min-height: 2.5rem;
  }
  button.control:hover { border-color: var(--accent); }
  .popup-backdrop { position: fixed; inset: 0; background: transparent; display: none; z-index: 10; }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; }
  p.lede { color: var(--text-muted); }
  details.frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }
  details.frame > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1.1rem;
  }
  details.frame[data-locked="true"] > summary { cursor: not-allowed; color: var(--text-muted); }
  details.frame[data-status="done"] > summary { cursor: default; color: var(--text); }
  details.frame > summary::-webkit-details-marker { display: none; }
  .frame-title { font-weight: 600; }
  .frame-badge { font-size: 0.85rem; color: var(--text-muted); }
  details.frame[data-status="done"] .frame-badge { color: var(--ok); }
  details.frame[data-status="error"] .frame-badge { color: var(--fail); }
  .frame-change {
    display: none;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  details.frame[data-status="done"] .frame-change { display: inline-block; }
  .frame-body { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
  .frame-body input[type="password"] {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    min-height: 2.5rem;
  }
  .frame-body button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  .frame-error { color: var(--fail); min-height: 1.2em; }
  @media (max-width: 480px) {
    header.topbar { justify-content: center; }
    details.frame > summary { padding: 0.75rem 0.9rem; }
    .frame-change { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
  </header>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> 🇺🇸 English</label>
        <label><input type="radio" name="lang" value="he"> 🇮🇱 עברית</label>
      </div>
    </div>
  </div>

  <main>
    <h1 data-i18n="heading"></h1>
    <p class="lede" data-i18n="lede"></p>

    <details id="frame-render-key" class="frame" data-status="ready" data-locked="false" open>
      <summary>
        <span class="frame-title" data-i18n="frame1_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-key" data-i18n="change_button"></button>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame1_instructions"></p>
        <input id="render-key-input" type="password">
        <button id="render-key-submit" type="button" data-i18n="validate_button"></button>
        <p id="render-key-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-github-app" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame2_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="github-app" data-i18n="change_button"></button>
      </summary>
      <div class="frame-body">
        <div id="github-app-create-section">
          <p data-i18n="frame2_instructions"></p>
          <input id="github-app-name-input" type="text">
          <button id="github-app-create-submit" type="button" data-i18n="create_app_button"></button>
        </div>
        <div id="github-app-install-section" style="display: none;">
          <p data-i18n="frame2_install_instructions"></p>
          <button id="github-app-install-submit" type="button" data-i18n="install_button"></button>
        </div>
        <p id="github-app-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-supabase" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame3_title"></span>
        <span class="frame-badge"></span>
      </summary>
      <div class="frame-body"><p data-i18n="coming_soon"></p></div>
    </details>

    <details id="frame-llm-provider" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame4_title"></span>
        <span class="frame-badge"></span>
      </summary>
      <div class="frame-body"><p data-i18n="coming_soon"></p></div>
    </details>

    <details id="frame-uptime-pinger" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame5_title"></span>
        <span class="frame-badge"></span>
      </summary>
      <div class="frame-body"><p data-i18n="coming_soon"></p></div>
    </details>

    <details id="frame-render-deploy" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame6_title"></span>
        <span class="frame-badge"></span>
      </summary>
      <div class="frame-body"><p data-i18n="coming_soon"></p></div>
    </details>
  </main>

<script>
  window.ONBOARDING_BASE_URL = "__ONBOARDING_BASE_URL__";
  window.SUPABASE_OAUTH_CLIENT_ID = "__SUPABASE_OAUTH_CLIENT_ID__";

  const STRINGS = {
    en: {
      page_title: "Set up your own reviewer",
      heading: "Set up your own PR review bot",
      lede: "Work through each step below. Nothing you enter here is stored on this server — it stays in your browser for this session only.",
      theme_light: "Light", theme_dark: "Dark", theme_system: "System",
      theme_popup_title: "Theme", lang_popup_title: "Language",
      frame1_title: "1. Render API key",
      frame1_instructions: "Get a key from Render's dashboard: Account Settings → API Keys.",
      frame1_placeholder: "rnd_...",
      frame2_title: "2. GitHub App",
      frame3_title: "3. Supabase database",
      frame4_title: "4. LLM provider",
      frame5_title: "5. Keep-warm pinger",
      frame6_title: "6. Deploy to Render",
      coming_soon: "Coming soon.",
      validate_button: "Validate",
      change_button: "Change",
      badge_locked: "Locked", badge_ready: "Not started",
      badge_error: "Error", badge_done: "✓ Validated",
      badge_app_created: "✓ App created — install it next",
      err_empty_key: "Paste your Render API key first.",
      err_invalid_key: "That key was rejected by Render. Double-check it and try again.",
      err_unreachable: "Render's API is unreachable right now. Try again in a moment.",
      err_network: "Could not reach the wizard's server. Try again.",
      checking: "checking…",
      restored: "restored from this session",
      owner_prefix: "owner: ",
      frame2_instructions: "Name your GitHub App (must be unique on GitHub), then click Create App. This will be created under whichever GitHub account you're currently logged into in this browser — check that's the right one before continuing.",
      frame2_name_placeholder: "my-pr-review-bot",
      create_app_button: "Create App",
      frame2_install_instructions: "Your App was created. Now install it on the account/repos you want it to review.",
      install_button: "Install App",
      err_github_name_empty: "Name your App first.",
      err_github_callback_invalid: "That didn't come back from GitHub as expected. Please try again.",
      err_github_exchange_failed: "GitHub rejected that — the code may have expired. Try creating the App again.",
      err_github_unreachable: "GitHub is unreachable right now. Try again in a moment.",
      err_github_installation_not_found: "GitHub couldn't find that installation. Try installing again.",
      err_github_invalid_credentials: "GitHub rejected the App's credentials. Try creating the App again.",
      account_prefix: "account: ",
    },
    he: {
      page_title: "הקמת בודק ה-PR שלך",
      heading: "הקמת בוט בדיקת PR משלך",
      lede: "עברו על כל שלב למטה. שום דבר שתזינו כאן לא נשמר בשרת הזה — הוא נשאר בדפדפן שלכם למשך הפעלה זו בלבד.",
      theme_light: "בהיר", theme_dark: "כהה", theme_system: "מערכת",
      theme_popup_title: "עיצוב", lang_popup_title: "שפה",
      frame1_title: "1. מפתח API של Render",
      frame1_instructions: "קבלו מפתח מלוח הבקרה של Render: Account Settings ← API Keys.",
      frame1_placeholder: "rnd_...",
      frame2_title: "2. אפליקציית GitHub",
      frame3_title: "3. מסד נתונים ב-Supabase",
      frame4_title: "4. ספק LLM",
      frame5_title: "5. פינגר לשמירה על פעילות",
      frame6_title: "6. פריסה ל-Render",
      coming_soon: "בקרוב.",
      validate_button: "אימות",
      change_button: "שינוי",
      badge_locked: "נעול", badge_ready: "טרם התחיל",
      badge_error: "שגיאה", badge_done: "✓ אומת",
      badge_app_created: "✓ האפליקציה נוצרה — כעת התקינו אותה",
      err_empty_key: "הדביקו קודם את מפתח ה-API של Render.",
      err_invalid_key: "המפתח נדחה על ידי Render. בדקו אותו שוב ונסו שנית.",
      err_unreachable: "שירות ה-API של Render אינו זמין כרגע. נסו שוב בעוד רגע.",
      err_network: "לא ניתן להתחבר לשרת האשף. נסו שוב.",
      checking: "בודק…",
      restored: "שוחזר מהפעלה זו",
      owner_prefix: "בעלים: ",
      frame2_instructions: "תנו שם לאפליקציית ה-GitHub שלכם (חייב להיות ייחודי ב-GitHub), ואז לחצו על יצירת אפליקציה. האפליקציה תיווצר תחת חשבון ה-GitHub שאליו אתם מחוברים כרגע בדפדפן זה — ודאו שזה החשבון הנכון לפני שתמשיכו.",
      frame2_name_placeholder: "my-pr-review-bot",
      create_app_button: "יצירת אפליקציה",
      frame2_install_instructions: "האפליקציה נוצרה. כעת התקינו אותה על החשבון/המאגרים שברצונכם שתבדוק.",
      install_button: "התקנת אפליקציה",
      err_github_name_empty: "תנו שם לאפליקציה קודם.",
      err_github_callback_invalid: "התגובה מ-GitHub לא הייתה כצפוי. נסו שוב.",
      err_github_exchange_failed: "GitHub דחה את הבקשה — ייתכן שהקוד פג תוקף. נסו ליצור את האפליקציה מחדש.",
      err_github_unreachable: "GitHub אינו זמין כרגע. נסו שוב בעוד רגע.",
      err_github_installation_not_found: "GitHub לא מצא את ההתקנה. נסו להתקין שוב.",
      err_github_invalid_credentials: "GitHub דחה את פרטי האפליקציה. נסו ליצור את האפליקציה מחדש.",
      account_prefix: "חשבון: ",
    },
  };

  const THEME_ICON = { light: "☀️", dark: "🌙", system: "🖥️" };
  const LANG_LABEL = { en: "🇺🇸 English", he: "🇮🇱 עברית" };

  const KNOWN_LANGS = ["en", "he"];
  const KNOWN_THEMES = ["light", "dark", "system"];

  function readStoredLang() {
    const stored = localStorage.getItem("onboarding_lang");
    return KNOWN_LANGS.includes(stored) ? stored : "en";
  }

  function readStoredTheme() {
    const stored = localStorage.getItem("onboarding_theme");
    return KNOWN_THEMES.includes(stored) ? stored : "system";
  }

  let currentLang = readStoredLang();
  let currentTheme = readStoredTheme();

  function t(key) {
    return STRINGS[currentLang][key] || STRINGS.en[key] || key;
  }

  function applyTheme(theme) {
    currentTheme = theme;
    localStorage.setItem("onboarding_theme", theme);
    document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
    document.getElementById("themeToggleBtn").textContent = `${THEME_ICON[theme]} ${t("theme_" + theme)}`;
    document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
  }

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("onboarding_lang", lang);
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
    document.title = t("page_title");
    document.getElementById("langToggleBtn").textContent = LANG_LABEL[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.getElementById("render-key-input").placeholder = t("frame1_placeholder");
    document.getElementById("github-app-name-input").placeholder = t("frame2_name_placeholder");
    document.getElementById("themePopupTitle").textContent = t("theme_popup_title");
    document.getElementById("langPopupTitle").textContent = t("lang_popup_title");
    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
    refreshFrameBadges();
    if (currentRenderKeyErrorKey) {
      document.getElementById("render-key-error").textContent = t(currentRenderKeyErrorKey);
    }
    if (currentGithubAppErrorKey) {
      document.getElementById("github-app-error").textContent = t(currentGithubAppErrorKey);
    }
    applyTheme(currentTheme);
  }

  const STORAGE_KEYS = {
    "render-key": "onboarding.renderApiKey",
    "github-app": "onboarding.githubApp",
  };

  // Never JSON.parse this key's value directly: a corrupted/foreign-shaped
  // stored value would throw out of whatever handler read it (including
  // DOMContentLoaded, taking every later listener with it). Same defensive
  // read-then-validate shape as readStoredLang/readStoredTheme above.
  function readStoredGithubApp() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["github-app"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // SOURCE OF TRUTH: scripts/create_github_app.py's MANIFEST_PERMISSIONS /
  // MANIFEST_EVENTS. These two lists must stay identical — the CLI script and
  // this wizard create the same App. Change them there first, then here;
  // tests/test_onboarding_page.py::test_manifest_permissions_match_the_cli_script
  // imports the Python constants and fails if these drift.
  const MANIFEST_PERMISSIONS = {
    pull_requests: "write", contents: "read", issues: "write", metadata: "read",
  };
  const MANIFEST_EVENTS = ["pull_request"];
  const GITHUB_MANIFEST_STATE_KEY = "onboarding.githubManifestState";

  const FRAME_ORDER = [
    "render-key", "github-app", "supabase", "llm-provider",
    "uptime-pinger", "render-deploy",
  ];

  const frameState = {};
  FRAME_ORDER.forEach((id) => { frameState[id] = {status: "locked", detailKey: null, detailValue: null}; });
  frameState["render-key"].status = "ready";

  let currentRenderKeyErrorKey = null;
  let currentGithubAppErrorKey = null;

  function frameEl(id) {
    return document.getElementById(`frame-${id}`);
  }

  function badgeEl(id) {
    return frameEl(id).querySelector(".frame-badge");
  }

  function renderBadge(id) {
    const {status, detailKey, detailValue} = frameState[id];
    const label = t("badge_" + status);
    const detail = detailKey ? `${t(detailKey)}${detailValue ?? ""}` : "";
    badgeEl(id).textContent = detail ? `${label} — ${detail}` : label;
  }

  function refreshFrameBadges() {
    FRAME_ORDER.forEach(renderBadge);
  }

  function setFrameStatus(id, status, detailKey, detailValue) {
    frameState[id] = {status, detailKey: detailKey || null, detailValue: detailValue ?? null};
    frameEl(id).dataset.status = status;
    renderBadge(id);
  }

  function nextFrame(id) {
    return FRAME_ORDER[FRAME_ORDER.indexOf(id) + 1];
  }

  function lockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "locked");
    const key = STORAGE_KEYS[id];
    if (key) sessionStorage.removeItem(key);
    // Frame 2's create/install sections are a one-way toggle otherwise: the
    // storage clear above would leave "Install App" on screen with nothing
    // behind it, and clicking it would report a misleading GitHub error.
    if (id === "github-app") resetGithubAppCreateSection();
  }

  function unlockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "false";
    setFrameStatus(id, "ready");
  }

  function relockDownstreamOf(id) {
    FRAME_ORDER.slice(FRAME_ORDER.indexOf(id) + 1).forEach(lockFrame);
  }

  function completeFrame(id, detailKey, detailValue) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "done", detailKey, detailValue);
    const next = nextFrame(id);
    if (next) unlockFrame(next);
  }

  function beginChange(id) {
    relockDownstreamOf(id);
    const el = frameEl(id);
    el.dataset.locked = "false";
    el.open = true;
    setFrameStatus(id, "ready");
    // relockDownstreamOf only clears *later* frames' storage, so a frame
    // changing itself keeps its own stale value — which for frame 2 means a
    // mid-change refresh would silently re-complete it from sessionStorage.
    // Scoped to frame 2 on purpose; frame 1's equivalent gap is a separate
    // parked issue (root ISSUES.md).
    if (id === "github-app") {
      sessionStorage.removeItem(STORAGE_KEYS["github-app"]);
      resetGithubAppCreateSection();
    }
  }

  async function validateRenderKey() {
    const input = document.getElementById("render-key-input");
    const key = input.value.trim();
    const errorEl = document.getElementById("render-key-error");
    errorEl.textContent = "";
    currentRenderKeyErrorKey = null;
    if (!key) {
      currentRenderKeyErrorKey = "err_empty_key";
      errorEl.textContent = t("err_empty_key");
      return;
    }
    setFrameStatus("render-key", "ready", "checking");
    let resp;
    try {
      resp = await fetch("/api/render/validate-key", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: key}),
      });
    } catch (err) {
      setFrameStatus("render-key", "error");
      currentRenderKeyErrorKey = "err_network";
      errorEl.textContent = t("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      setFrameStatus("render-key", "error");
      currentRenderKeyErrorKey = "err_unreachable";
      errorEl.textContent = t("err_unreachable");
      return;
    }
    if (body.valid) {
      sessionStorage.setItem(STORAGE_KEYS["render-key"], key);
      input.value = "";
      completeFrame("render-key", "owner_prefix", body.owner_name);
    } else if (body.reason === "invalid_key") {
      setFrameStatus("render-key", "error");
      currentRenderKeyErrorKey = "err_invalid_key";
      errorEl.textContent = t("err_invalid_key");
    } else {
      setFrameStatus("render-key", "error");
      currentRenderKeyErrorKey = "err_unreachable";
      errorEl.textContent = t("err_unreachable");
    }
  }

  function buildManifest(appName) {
    return {
      name: appName,
      url: window.ONBOARDING_BASE_URL,
      public: false,
      hook_attributes: {url: "https://example.invalid/webhook", active: true},
      redirect_url: `${window.ONBOARDING_BASE_URL}/?gh_step=manifest`,
      setup_url: `${window.ONBOARDING_BASE_URL}/?gh_step=install`,
      default_events: MANIFEST_EVENTS,
      default_permissions: MANIFEST_PERMISSIONS,
    };
  }

  function submitManifestForm(manifest, state) {
    const form = document.createElement("form");
    form.method = "POST";
    form.action = `https://github.com/settings/apps/new?state=${encodeURIComponent(state)}`;
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "manifest";
    input.value = JSON.stringify(manifest);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
  }

  function showGithubAppReadyToInstall() {
    document.getElementById("github-app-create-section").style.display = "none";
    document.getElementById("github-app-install-section").style.display = "block";
    // Toggling those two sections is invisible on a collapsed <details> whose
    // badge still reads "Not started" — and the visitor has just approved a
    // real App on GitHub, so they need to see that it worked (spec section 3
    // step 7's intermediate state).
    frameEl("github-app").open = true;
    setFrameStatus("github-app", "app_created");
  }

  function resetGithubAppCreateSection() {
    document.getElementById("github-app-install-section").style.display = "none";
    document.getElementById("github-app-create-section").style.display = "block";
    document.getElementById("github-app-error").textContent = "";
    currentGithubAppErrorKey = null;
  }

  function githubAppError(key) {
    setFrameStatus("github-app", "error");
    currentGithubAppErrorKey = key;
    document.getElementById("github-app-error").textContent = t(key);
  }

  function createGithubApp() {
    const input = document.getElementById("github-app-name-input");
    const name = input.value.trim();
    document.getElementById("github-app-error").textContent = "";
    currentGithubAppErrorKey = null;
    if (!name) {
      githubAppError("err_github_name_empty");
      return;
    }
    const state = crypto.randomUUID();
    sessionStorage.setItem(GITHUB_MANIFEST_STATE_KEY, state);
    submitManifestForm(buildManifest(name), state);
  }

  async function handleGithubManifestCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "manifest") return;
    history.replaceState(null, "", location.pathname);
    const expectedState = sessionStorage.getItem(GITHUB_MANIFEST_STATE_KEY);
    sessionStorage.removeItem(GITHUB_MANIFEST_STATE_KEY);
    const code = params.get("code");
    if (!expectedState || params.get("state") !== expectedState || !code) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/github/exchange-manifest-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({code: code}),
      });
    } catch (err) {
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify({
        app_id: body.app_id, slug: body.slug,
        private_key_b64: body.private_key_b64, webhook_secret: body.webhook_secret,
      }));
      showGithubAppReadyToInstall();
    } else if (body.reason === "exchange_failed") {
      githubAppError("err_github_exchange_failed");
    } else {
      githubAppError("err_github_unreachable");
    }
  }

  function installGithubApp() {
    const stored = readStoredGithubApp();
    if (!stored || !stored.slug) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    const state = crypto.randomUUID();
    sessionStorage.setItem(GITHUB_MANIFEST_STATE_KEY, state);
    location.href = `https://github.com/apps/${encodeURIComponent(stored.slug)}/installations/new?state=${encodeURIComponent(state)}`;
  }

  async function handleGithubInstallCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "install") return;
    history.replaceState(null, "", location.pathname);
    const expectedState = sessionStorage.getItem(GITHUB_MANIFEST_STATE_KEY);
    sessionStorage.removeItem(GITHUB_MANIFEST_STATE_KEY);
    const installationId = params.get("installation_id");
    if (!expectedState || params.get("state") !== expectedState || !installationId) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    const stored = readStoredGithubApp();
    if (!stored) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/github/verify-installation", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          app_id: stored.app_id,
          private_key_b64: stored.private_key_b64,
          installation_id: parseInt(installationId, 10),
        }),
      });
    } catch (err) {
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      stored.installation_id = parseInt(installationId, 10);
      stored.account_login = body.account_login;
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify(stored));
      completeFrame("github-app", "account_prefix", body.account_login);
    } else if (body.reason === "installation_not_found") {
      githubAppError("err_github_installation_not_found");
    } else if (body.reason === "invalid_credentials") {
      githubAppError("err_github_invalid_credentials");
    } else {
      githubAppError("err_github_unreachable");
    }
  }

  function restoreFromSession() {
    if (sessionStorage.getItem(STORAGE_KEYS["render-key"])) {
      completeFrame("render-key", "restored", null);
    }
    const githubApp = readStoredGithubApp();
    if (githubApp && githubApp.installation_id) {
      completeFrame("github-app", "restored", null);
    } else if (githubApp) {
      showGithubAppReadyToInstall();
    }
  }

  function guardLockedFrames() {
    document.querySelectorAll(".frame").forEach((el) => {
      el.addEventListener("toggle", () => {
        if (el.open && el.dataset.locked === "true") {
          el.open = false;
        }
      });
    });
  }

  function attachChangeButtons() {
    document.querySelectorAll(".frame-change").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        beginChange(btn.dataset.frame);
      });
    });
  }

  function positionPopup(popup, anchorBtn) {
    const margin = 8;
    const rect = anchorBtn.getBoundingClientRect();
    const isRtl = document.documentElement.getAttribute("dir") === "rtl";
    popup.style.top = `${rect.bottom + margin}px`;
    popup.style.left = "auto";
    popup.style.right = "auto";
    const popupWidth = popup.offsetWidth;
    if (isRtl) {
      const maxRight = window.innerWidth - popupWidth - margin;
      const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
      popup.style.right = `${right}px`;
    } else {
      const maxLeft = window.innerWidth - popupWidth - margin;
      const left = Math.max(margin, Math.min(rect.left, maxLeft));
      popup.style.left = `${left}px`;
    }
  }

  function openPopup(id, anchorBtn) {
    closeAllPopups();
    const backdrop = document.getElementById(id);
    backdrop.classList.add("open");
    positionPopup(backdrop.querySelector(".popup"), anchorBtn);
  }

  function closeAllPopups() {
    document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("render-key-submit").addEventListener("click", validateRenderKey);
    document.getElementById("github-app-create-submit").addEventListener("click", createGithubApp);
    document.getElementById("github-app-install-submit").addEventListener("click", installGithubApp);
    guardLockedFrames();
    attachChangeButtons();

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));
    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });
    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyTheme(event.target.value); closeAllPopups(); });
    });
    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyLanguage(event.target.value); closeAllPopups(); });
    });

    applyLanguage(currentLang);
    restoreFromSession();
    handleGithubManifestCallback();
    handleGithubInstallCallback();
  });
</script>
</body>
</html>
