<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your own reviewer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1f2933;
    --text-muted: #5c6773;
    --border: #dde2e7;
    --accent: #3a6ea5;
    --ok: #2f7d4f;
    --fail: #b3454b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b;
      --surface: #1a1f26;
      --surface-2: #22282f;
      --text: #e6e9ec;
      --text-muted: #9aa5b1;
      --border: #2b323a;
      --accent: #7ba7d9;
      --ok: #5fbf87;
      --fail: #e08086;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #22282f;
    --text: #e6e9ec;
    --text-muted: #9aa5b1;
    --border: #2b323a;
    --accent: #7ba7d9;
    --ok: #5fbf87;
    --fail: #e08086;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
    min-height: 2.5rem;
  }
  button.control:hover { border-color: var(--accent); }
  .popup-backdrop { position: fixed; inset: 0; background: transparent; display: none; z-index: 10; }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; }
  p.lede { color: var(--text-muted); }
  details.frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }
  details.frame > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1.1rem;
  }
  details.frame[data-locked="true"] > summary { cursor: not-allowed; color: var(--text-muted); }
  details.frame[data-status="done"] > summary { cursor: default; color: var(--text); }
  details.frame > summary::-webkit-details-marker { display: none; }
  .frame-title { font-weight: 600; }
  .frame-badge { font-size: 0.85rem; color: var(--text-muted); }
  details.frame[data-status="done"] .frame-badge { color: var(--ok); }
  details.frame[data-status="error"] .frame-badge { color: var(--fail); }
  details.frame[data-status="provisioning"] .frame-badge { color: var(--accent); }
  .frame-change {
    display: none;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  details.frame[data-status="done"] .frame-change { display: inline-block; }
  .frame-body { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
  .frame-body input[type="password"], .frame-body input[type="text"], .frame-body select {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    min-height: 2.5rem;
  }
  .frame-body button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  .frame-error { color: var(--fail); min-height: 1.2em; }
  @media (max-width: 480px) {
    header.topbar { justify-content: center; }
    details.frame > summary { padding: 0.75rem 0.9rem; }
    .frame-change { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
  </header>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> 🇺🇸 English</label>
        <label><input type="radio" name="lang" value="he"> 🇮🇱 עברית</label>
      </div>
    </div>
  </div>

    <h1 data-i18n="heading"></h1>
    <p class="lede" data-i18n="lede"></p>

      <summary>

        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-key" data-i18n="change_button"></button>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame1_instructions"></p>
        <input id="render-key-input" type="password">
        <button id="render-key-submit" type="button" data-i18n="validate_button"></button>
        <p id="render-key-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-render-service" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame_render_service_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-service" data-i18n="change_button"></button>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame_render_service_instructions"></p>
        <label data-i18n="frame_render_service_repo_label"></label>
        <input id="render-service-repo-input" type="text">
        <label data-i18n="frame_render_service_name_label"></label>
        <input id="render-service-name-input" type="text">
        <button id="render-service-submit" type="button" data-i18n="create_service_button"></button>
        <p id="render-service-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-github-app" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame2_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="github-app" data-i18n="change_button"></button>
      </summary>
      <div class="frame-body">
        <div id="github-app-create-section">
          <p data-i18n="frame2_instructions"></p>
          <input id="github-app-name-input" type="text">
          <button id="github-app-create-submit" type="button" data-i18n="create_app_button"></button>
        </div>
        <div id="github-app-install-section" style="display: none;">
          <p data-i18n="frame2_install_instructions"></p>
          <button id="github-app-install-submit" type="button" data-i18n="install_button"></button>
        </div>
        <div id="github-app-webhook-retry-section" style="display: none;">
          <p data-i18n="frame2_webhook_retry_instructions"></p>
          <button id="github-app-webhook-retry-submit" type="button" data-i18n="retry_button"></button>
        </div>
        <p id="github-app-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-supabase" class="frame" data-status="locked" data-locked="true">

        </div>
        <p id="supabase-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-llm-provider" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame4_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="llm-provider" data-i18n="change_button"></button>

        <div class="radio-group">

          <label><input type="radio" name="llm-provider-choice" value="groq" id="llm-provider-choice-groq"> <span data-i18n="frame4_provider_groq"></span></label>

        </div>
        <input id="llm-provider-api-key-input" type="password" style="display: none;">
        <input id="llm-provider-file-input" type="file" accept="application/json" style="display: none;">
        <button id="llm-provider-validate-submit" type="button" data-i18n="validate_button" style="display: none;"></button>
        <div id="llm-provider-model-section" style="display: none;">
          <p data-i18n="frame4_model_instructions"></p>
          <select id="llm-provider-model-select"></select>
          <button id="llm-provider-continue-submit" type="button" data-i18n="continue_button"></button>
        </div>
        <p id="llm-provider-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-uptime-pinger" class="frame" data-status="locked" data-locked="true">

        <span class="frame-title" data-i18n="frame5_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="uptime-pinger" data-i18n="change_button"></button>

      <div class="frame-body">

        </div>
        <div id="uptime-pinger-form-section" style="display: none;">
          <p data-i18n="frame5_instructions"></p>
          <input id="uptime-pinger-api-key-input" type="password">
          <button id="uptime-pinger-submit" type="button" data-i18n="validate_button"></button>
        </div>
        <p id="uptime-pinger-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-render-deploy" class="frame" data-status="locked" data-locked="true">

        <span class="frame-badge"></span>
      </summary>
      <div class="frame-body">
        <div id="render-deploy-trigger-section">

        </div>

          <p data-i18n="frame6_polling"></p>
          <button id="render-deploy-check-again-submit" type="button" data-i18n="check_again_button" style="display: none;"></button>
        </div>
        <div id="render-deploy-done-section" style="display: none;">
          <p data-i18n="frame6_done"></p>
          <a id="render-deploy-service-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <p id="render-deploy-error" class="frame-error"></p>
      </div>
    </details>
  </main>

  const THEME_ICON = { light: "☀️", dark: "🌙", system: "🖥️" };
  const LANG_LABEL = { en: "🇺🇸 English", he: "🇮🇱 עברית" };

  const KNOWN_LANGS = ["en", "he"];
  const KNOWN_THEMES = ["light", "dark", "system"];

  function readStoredLang() {
    const stored = localStorage.getItem("onboarding_lang");
    return KNOWN_LANGS.includes(stored) ? stored : "en";
  }

  function readStoredTheme() {
    const stored = localStorage.getItem("onboarding_theme");
    return KNOWN_THEMES.includes(stored) ? stored : "system";
  }

  let currentLang = readStoredLang();
  let currentTheme = readStoredTheme();

  function t(key) {
    return STRINGS[currentLang][key] || STRINGS.en[key] || key;
  }

  function applyTheme(theme) {
    currentTheme = theme;
    localStorage.setItem("onboarding_theme", theme);
    document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
    document.getElementById("themeToggleBtn").textContent = `${THEME_ICON[theme]} ${t("theme_" + theme)}`;
    document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
  }

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("onboarding_lang", lang);
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
    document.title = t("page_title");
    document.getElementById("langToggleBtn").textContent = LANG_LABEL[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.getElementById("render-key-input").placeholder = t("frame1_placeholder");
    document.getElementById("github-app-name-input").placeholder = t("frame2_name_placeholder");
    document.getElementById("supabase-project-name-input").placeholder = t("frame3_name_placeholder");
    document.getElementById("themePopupTitle").textContent = t("theme_popup_title");
    document.getElementById("langPopupTitle").textContent = t("lang_popup_title");
    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
    refreshFrameBadges();
    if (currentRenderKeyErrorKey) {
      document.getElementById("render-key-error").textContent = t(currentRenderKeyErrorKey);
    }
    if (currentRenderServiceErrorKey) {
      document.getElementById("render-service-error").textContent = t(currentRenderServiceErrorKey);
    }
    if (currentRenderDeployErrorKey) {
      document.getElementById("render-deploy-error").textContent = t(currentRenderDeployErrorKey);
    }
    if (currentGithubAppErrorKey) {
      document.getElementById("github-app-error").textContent = t(currentGithubAppErrorKey);
    }
    if (currentSupabaseErrorKey) {
      document.getElementById("supabase-error").textContent = t(currentSupabaseErrorKey);
    }
    if (currentLlmProviderErrorKey) {
      document.getElementById("llm-provider-error").textContent = t(currentLlmProviderErrorKey);
    }
    if (currentUptimePingerErrorKey) {
      document.getElementById("uptime-pinger-error").textContent = t(currentUptimePingerErrorKey);
    }
    applyTheme(currentTheme);
  }

  const STORAGE_KEYS = {
    "render-key": "onboarding.renderApiKey",
    "render-service": "onboarding.renderService",
    "github-app": "onboarding.githubApp",
    "supabase": "onboarding.supabase",
    "llm-provider": "onboarding.llmProvider",
    "uptime-pinger": "onboarding.uptimeRobot",
  };

  // Written by sub-project 6 on its own completion (not yet built) --
  // frame 5 only ever reads this key, never writes it. See
  // docs/superpowers/specs/2026-08-27-onboarding-uptimerobot-frame-design.md
  // section 3's forward contract.
  const RENDER_SERVICE_URL_KEY = "onboarding.renderServiceUrl";

  const SUPABASE_PENDING_KEY = "onboarding.supabasePending";

  // Never JSON.parse this key's value directly: a corrupted/foreign-shaped
  // stored value would throw out of whatever handler read it (including
  // DOMContentLoaded, taking every later listener with it). Same defensive
  // read-then-validate shape as readStoredLang/readStoredTheme above.
  function readStoredGithubApp() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["github-app"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // Same defensive shape as readStoredGithubApp() above, for frame 3's
  // sessionStorage key — a corrupted/foreign-shaped stored value must never
  // throw out of a handler (including DOMContentLoaded, which would take
  // every later listener with it).
  function readStoredSupabase() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["supabase"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // Same defensive shape as readStoredGithubApp()/readStoredSupabase() above.
  function readStoredRenderService() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["render-service"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // SOURCE OF TRUTH: scripts/create_github_app.py's MANIFEST_PERMISSIONS /
  // MANIFEST_EVENTS. These two lists must stay identical — the CLI script and
  // this wizard create the same App. Change them there first, then here;
  // tests/test_onboarding_page.py::test_manifest_permissions_match_the_cli_script
  // imports the Python constants and fails if these drift.
  const MANIFEST_PERMISSIONS = {
    pull_requests: "write", contents: "read", issues: "write", metadata: "read",
  };
  const MANIFEST_EVENTS = ["pull_request"];
  const GITHUB_MANIFEST_STATE_KEY = "onboarding.githubManifestState";

  const FRAME_ORDER = [
    "render-key", "render-service", "github-app", "supabase", "llm-provider",
    "uptime-pinger", "render-deploy",
  ];

  const frameState = {};
  FRAME_ORDER.forEach((id) => { frameState[id] = {status: "locked", detailKey: null, detailValue: null}; });
  frameState["render-key"].status = "ready";

  let currentRenderKeyErrorKey = null;
  let currentGithubAppErrorKey = null;
  let currentSupabaseErrorKey = null;

  function frameEl(id) {
    return document.getElementById(`frame-${id}`);
  }

  function badgeEl(id) {
    return frameEl(id).querySelector(".frame-badge");
  }

  function renderBadge(id) {
    const {status, detailKey, detailValue} = frameState[id];
    const label = t("badge_" + status);
    const detail = detailKey ? `${t(detailKey)}${detailValue ?? ""}` : "";
    badgeEl(id).textContent = detail ? `${label} — ${detail}` : label;
  }

  function refreshFrameBadges() {
    FRAME_ORDER.forEach(renderBadge);
  }

  function setFrameStatus(id, status, detailKey, detailValue) {
    frameState[id] = {status, detailKey: detailKey || null, detailValue: detailValue ?? null};
    frameEl(id).dataset.status = status;
    renderBadge(id);
  }

  function nextFrame(id) {
    return FRAME_ORDER[FRAME_ORDER.indexOf(id) + 1];
  }

  function lockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "locked");
    const key = STORAGE_KEYS[id];
    if (key) sessionStorage.removeItem(key);
    // Frame 2's create/install sections are a one-way toggle otherwise: the
    // storage clear above would leave "Install App" on screen with nothing
    // behind it, and clicking it would report a misleading GitHub error.
    // Frame 3's connect/org-picker/provisioning sections are the same
    // shape, one step longer.
    if (id === "github-app") resetGithubAppCreateSection();
    if (id === "supabase") resetSupabaseConnectSection();
    if (id === "llm-provider") resetLlmProviderSection();
    if (id === "uptime-pinger") resetUptimePingerSection();
    if (id === "render-deploy") resetRenderDeploySection();
  }

  function unlockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "false";
    setFrameStatus(id, "ready");
    if (id === "uptime-pinger") refreshUptimePingerBlockedState();
    if (id === "render-service") prefillRenderServiceDefaults();
  }

  function relockDownstreamOf(id) {
    FRAME_ORDER.slice(FRAME_ORDER.indexOf(id) + 1).forEach(lockFrame);
  }

  function completeFrame(id, detailKey, detailValue) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "done", detailKey, detailValue);
    const next = nextFrame(id);
    if (next) unlockFrame(next);
  }

  function beginChange(id) {
    relockDownstreamOf(id);
    const el = frameEl(id);
    el.dataset.locked = "false";
    el.open = true;
    setFrameStatus(id, "ready");
    // relockDownstreamOf only clears *later* frames' storage, so a frame
    // changing itself keeps its own stale value — which for frame 2 means a
    // mid-change refresh would silently re-complete it from sessionStorage.
    // Scoped to frame 2 on purpose; frame 1's equivalent gap is a separate
    // parked issue (root ISSUES.md).
    if (id === "render-service") {
      sessionStorage.removeItem(STORAGE_KEYS["render-service"]);
      sessionStorage.removeItem(RENDER_SERVICE_URL_KEY);
    }
    if (id === "github-app") {
      sessionStorage.removeItem(STORAGE_KEYS["github-app"]);
      resetGithubAppCreateSection();
    }
    if (id === "supabase") {
      sessionStorage.removeItem(STORAGE_KEYS["supabase"]);
      resetSupabaseConnectSection();
    }
    if (id === "llm-provider") {
      sessionStorage.removeItem(STORAGE_KEYS["llm-provider"]);
      resetLlmProviderSection();
    }
    if (id === "uptime-pinger") {
      sessionStorage.removeItem(STORAGE_KEYS["uptime-pinger"]);
      resetUptimePingerSection();
    }
  }

  let currentLlmProviderErrorKey = null;
  let pendingLlmProviderCredential = null;

  function resetLlmProviderSection() {
    document.querySelectorAll('input[name="llm-provider-choice"]').forEach((r) => { r.checked = false; });
    const apiKeyInput = document.getElementById("llm-provider-api-key-input");
    apiKeyInput.value = "";
    apiKeyInput.style.display = "none";
    const fileInput = document.getElementById("llm-provider-file-input");
    fileInput.value = "";
    fileInput.style.display = "none";
    document.getElementById("llm-provider-validate-submit").style.display = "none";
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    pendingLlmProviderCredential = null;
  }

  function llmProviderError(key) {
    setFrameStatus("llm-provider", "error");
    currentLlmProviderErrorKey = key;
    document.getElementById("llm-provider-error").textContent = t(key);
  }

  function llmProviderErrorForReason(reason) {
    const map = {
      unauthorized: "err_llm_unauthorized",
      forbidden: "err_llm_forbidden",
      rate_limited: "err_llm_rate_limited",
      provider_unreachable: "err_llm_unreachable",
      invalid_service_account_json: "err_llm_invalid_service_account_json",
    };
    llmProviderError(map[reason] || "err_llm_unreachable");
  }

  function getSelectedLlmProvider() {
    const checked = document.querySelector('input[name="llm-provider-choice"]:checked');
    return checked ? checked.value : null;
  }

  function handleLlmProviderChoice() {
    const provider = getSelectedLlmProvider();

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        const commaIdx = result.indexOf(",");
        resolve(commaIdx >= 0 ? result.slice(commaIdx + 1) : result);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function base64ToJsonSanityCheck(b64) {
    try {
      const decoded = atob(b64);
      JSON.parse(decoded);
      return true;
    } catch (err) {
      return false;
    }
  }

  async function validateLlmProviderCredential() {
    const provider = getSelectedLlmProvider();
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    pendingLlmProviderCredential = null;
    if (!provider) {
      llmProviderError("err_llm_no_provider");
      return;
    }
    let endpoint, payload, credentialFragment;
    if (provider === "gemini") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/gemini/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else if (provider === "groq") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/groq/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else {
      const fileInput = document.getElementById("llm-provider-file-input");
      const file = fileInput.files[0];
      if (!file) {
        llmProviderError("err_llm_no_file");
        return;
      }
      let b64;
      try {
        b64 = await readFileAsBase64(file);
      } catch (err) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      if (!(await base64ToJsonSanityCheck(b64))) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      endpoint = "/api/llm/vertex/list-models";
      payload = {service_account_key_b64: b64};
      credentialFragment = {gcp_service_account_key_b64: b64};
    }
    let resp;
    try {
      resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
    } catch (err) {
      llmProviderError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      llmProviderError("err_llm_unreachable");
      return;
    }
    if (!body.valid) {
      llmProviderErrorForReason(body.reason);
      return;
    }
    showLlmProviderModels(body.models, provider, credentialFragment, body.project_id);
  }

  async function handleGithubManifestCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "manifest") return;
    history.replaceState(null, "", location.pathname);
    const expectedState = sessionStorage.getItem(GITHUB_MANIFEST_STATE_KEY);
    sessionStorage.removeItem(GITHUB_MANIFEST_STATE_KEY);
    const code = params.get("code");
    if (!expectedState || params.get("state") !== expectedState || !code) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/github/exchange-manifest-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({code: code}),
      });
    } catch (err) {
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify({
        app_id: body.app_id, slug: body.slug,
        private_key_b64: body.private_key_b64, webhook_secret: body.webhook_secret,

  async function handleGithubInstallCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "install") return;
    history.replaceState(null, "", location.pathname);
    const expectedState = sessionStorage.getItem(GITHUB_MANIFEST_STATE_KEY);
    sessionStorage.removeItem(GITHUB_MANIFEST_STATE_KEY);
    const installationId = params.get("installation_id");
    if (!expectedState || params.get("state") !== expectedState || !installationId) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    const stored = readStoredGithubApp();
    if (!stored) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/github/verify-installation", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          app_id: stored.app_id,
          private_key_b64: stored.private_key_b64,
          installation_id: parseInt(installationId, 10),
        }),
      });
    } catch (err) {
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      stored.installation_id = parseInt(installationId, 10);
      stored.account_login = body.account_login;
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify(stored));
      await finishGithubAppSetup(stored, body.account_login);
    } else if (body.reason === "installation_not_found") {
      githubAppError("err_github_installation_not_found");
    } else if (body.reason === "invalid_credentials") {
      githubAppError("err_github_invalid_credentials");
    } else {
      githubAppError("err_github_unreachable");
    }
  }

  function base64UrlEncode(bytes) {
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function generatePkcePair() {
    const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
    const verifier = base64UrlEncode(verifierBytes);
    const challengeBuffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const challenge = base64UrlEncode(new Uint8Array(challengeBuffer));
    return {verifier, challenge};
  }

  function generateDbPassword() {
    const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    let password = "";
    bytes.forEach((b) => { password += charset[b % charset.length]; });
    return password;
  }

  function resetSupabaseConnectSection() {
    document.getElementById("supabase-org-section").style.display = "none";
    document.getElementById("supabase-provisioning-section").style.display = "none";
    document.getElementById("supabase-check-status-submit").style.display = "none";
    document.getElementById("supabase-connect-section").style.display = "block";
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
  }

  function supabaseError(key) {
    setFrameStatus("supabase", "error");
    currentSupabaseErrorKey = key;
    document.getElementById("supabase-error").textContent = t(key);
  }

  function supabaseErrorForReason(reason, message) {
    if (reason === "project_creation_rejected" && message) {
      // Terminal: the org was picked and project creation was rejected for
      // a business reason (e.g. a free-tier project cap) that retrying the
      // same request won't fix. Reset first so "Connect Supabase" is back
      // on screen for the visitor to restart, THEN show the error —
      // resetSupabaseConnectSection() clears #supabase-error's text too.
      resetSupabaseConnectSection();
      // Supabase's own error text, relayed verbatim (spec section 4) —
      // not a translated string, since it isn't one of ours.
      setFrameStatus("supabase", "error");
      currentSupabaseErrorKey = null;
      document.getElementById("supabase-error").textContent = message;
      return;
    }
    // "unauthorized" here means callSupabaseRelay already tried (or had no
    // token to try) a refresh and it didn't recover the session — terminal,
    // since nothing left on screen can retry with the same dead token.
    if (reason === "unauthorized") {
      resetSupabaseConnectSection();
    }
    const key = {
      unauthorized: "err_supabase_reauthorize",
      invalid_code: "err_supabase_invalid_code",
      forbidden: "err_supabase_forbidden",
      rate_limited: "err_supabase_rate_limited",
      pooler_config_unavailable: "err_supabase_pooler_config_unavailable",
    }[reason] || "err_supabase_unreachable";
    supabaseError(key);
  }

  // Every Supabase relay call after the initial token exchange goes
  // through here: reads the held access_token from sessionStorage, and on
  // a "reason": "unauthorized" response, attempts exactly one
  // refresh-then-retry (spec section 3's "Token refresh" note) rather than
  // tracking a client-side expiry timer.
  async function callSupabaseRelay(endpoint, payload) {
    const stored = readStoredSupabase();
    if (!stored || !stored.access_token) {
      return {valid: false, reason: "unauthorized"};
    }
    const attempt = async (accessToken) => {
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({...payload, access_token: accessToken}),
      });
      if (!resp.ok) throw new Error("bad status");
      return resp.json();
    };
    let body;
    try {
      body = await attempt(stored.access_token);
    } catch (err) {
      return {valid: false, reason: "supabase_unreachable"};
    }
    if (body.valid || body.reason !== "unauthorized" || !stored.refresh_token) {
      return body;
    }
    let refreshBody;
    try {
      const refreshResp = await fetch("/api/supabase/refresh-access-token", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({refresh_token: stored.refresh_token}),
      });
      if (!refreshResp.ok) throw new Error("bad status");
      refreshBody = await refreshResp.json();
    } catch (err) {
      return body;
    }
    if (!refreshBody.valid) return body;
    stored.access_token = refreshBody.access_token;
    // Supabase's OAuth schema does not guarantee refresh_token is present in
    // every response (SupabaseTokens.refresh_token: str | None). Overwriting
    // unconditionally would clobber a still-valid refresh token with
    // null/undefined, permanently disabling future refreshes for the rest of
    // the session.
    if (refreshBody.refresh_token) {
      stored.refresh_token = refreshBody.refresh_token;
    }
    stored.expires_in = refreshBody.expires_in;
    sessionStorage.setItem(STORAGE_KEYS["supabase"], JSON.stringify(stored));
    try {
      return await attempt(stored.access_token);
    } catch (err) {
      return {valid: false, reason: "supabase_unreachable"};
    }
  }

  async function connectSupabase() {
    const input = document.getElementById("supabase-project-name-input");
    const name = input.value.trim();
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    if (!name) {
      supabaseError("err_supabase_name_empty");
      return;
    }
    try {
      const state = crypto.randomUUID();
      const {verifier, challenge} = await generatePkcePair();
      sessionStorage.setItem(SUPABASE_PENDING_KEY, JSON.stringify({state, verifier, name}));
      const redirectUri = `${window.ONBOARDING_BASE_URL}/?supabase_step=oauth_callback`;
      const params = new URLSearchParams({
        client_id: window.SUPABASE_OAUTH_CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "code",
        state: state,
        code_challenge: challenge,
        code_challenge_method: "S256",
      });
      location.href = `https://api.supabase.com/v1/oauth/authorize?${params.toString()}`;
    } catch (err) {
      supabaseError("err_supabase_unreachable");
    }
  }

  async function handleSupabaseOauthCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("supabase_step") !== "oauth_callback") return;
    history.replaceState(null, "", location.pathname);
    const pending = JSON.parse(sessionStorage.getItem(SUPABASE_PENDING_KEY) || "null");
    sessionStorage.removeItem(SUPABASE_PENDING_KEY);
    const code = params.get("code");
    if (!pending || params.get("state") !== pending.state || !code) {
      supabaseError("err_supabase_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/supabase/exchange-oauth-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({code: code, code_verifier: pending.verifier}),
      });
    } catch (err) {
      supabaseError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      supabaseError("err_supabase_unreachable");
      return;
    }
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return;
    }
    try {
      sessionStorage.setItem(STORAGE_KEYS["supabase"], JSON.stringify({
        access_token: body.access_token, refresh_token: body.refresh_token,
        expires_in: body.expires_in, name: pending.name,
      }));
    } catch (err) {
      // Storage quota/blocked: without this guard the tokens are lost and
      // this becomes an unhandled rejection with no visible error, unlike
      // every other step in this function.
      supabaseError("err_supabase_storage_failed");
      return;
    }
    await fetchSupabaseOrganizations();
  }

  async function fetchSupabaseOrganizations() {
    const body = await callSupabaseRelay("/api/supabase/list-organizations", {});
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return;
    }
    if (body.orgs.length === 1) {
      await kickOffProjectCreation(body.orgs[0].slug);
      return;
    }
    const select = document.getElementById("supabase-org-select");
    select.innerHTML = "";
    body.orgs.forEach((org) => {
      const option = document.createElement("option");
      option.value = org.slug;
      option.textContent = org.name;
      select.appendChild(option);
    });
    showSupabaseOrgPicker();
  }

  function showSupabaseOrgPicker() {
    document.getElementById("supabase-connect-section").style.display = "none";
    document.getElementById("supabase-org-section").style.display = "block";
    // Mirrors showSupabaseProvisioning() below: restoreFromSession() already
    // unlocked frame 3 to status "ready" (badge "Not started") and left it
    // closed before the OAuth redirect. Without this, a visitor with 2+
    // orgs returns from Supabase's consent screen to a collapsed accordion
    // row that still says "Not started" — no visible sign their
    // authorization worked.
    frameEl("supabase").open = true;
    setFrameStatus("supabase", "choosing_org");
  }

  async function confirmSupabaseOrg() {
    const select = document.getElementById("supabase-org-select");
    await kickOffProjectCreation(select.value);
  }

  async function kickOffProjectCreation(organizationSlug) {
    let stored = readStoredSupabase();
    if (!stored) {
      supabaseError("err_supabase_callback_invalid");
      return;
    }
    const dbPass = generateDbPassword();
    const body = await callSupabaseRelay("/api/supabase/create-project", {
      organization_slug: organizationSlug, name: stored.name, db_pass: dbPass,
    });
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return;
    }
    // Re-read AFTER the await: callSupabaseRelay may have refreshed and
    // written new tokens mid-call, and merging onto the pre-await snapshot
    // would silently discard them.
    stored = readStoredSupabase() || stored;
    stored.organization_slug = organizationSlug;
    stored.db_pass = dbPass;
    stored.ref = body.ref;
    stored.status = body.status;
    sessionStorage.setItem(STORAGE_KEYS["supabase"], JSON.stringify(stored));
    showSupabaseProvisioning();
    pollUntilReady(Date.now());
  }

  function showSupabaseProvisioning() {
    document.getElementById("supabase-connect-section").style.display = "none";
    document.getElementById("supabase-org-section").style.display = "none";
    document.getElementById("supabase-provisioning-section").style.display = "block";
    frameEl("supabase").open = true;
    setFrameStatus("supabase", "provisioning");
  }

  const SUPABASE_POLL_INTERVAL_MS = 5000;
  const SUPABASE_POLL_TIMEOUT_MS = 300000;

  async function handleProjectStatusResult(body) {
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return "error";
    }
    if (body.status === "ACTIVE_HEALTHY") {
      await fetchSupabaseConnectionInfo();
      return "ready";
    }
    if (body.status === "INIT_FAILED") {
      // Terminal, unlike the poll-timeout case: the project will never
      // become healthy on its own, so put "Connect Supabase" back on
      // screen rather than leaving the provisioning section's dead end up.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_provisioning_failed");
      return "error";
    }
    return "pending";
  }

  async function fetchProjectStatus(ref) {
    return await callSupabaseRelay("/api/supabase/project-status", {ref: ref});
  }

  async function pollUntilReady(startedAt) {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    const body = await fetchProjectStatus(stored.ref);
    const outcome = await handleProjectStatusResult(body);
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= SUPABASE_POLL_TIMEOUT_MS) {
      supabaseError("err_supabase_provisioning_timeout");
      document.getElementById("supabase-check-status-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollUntilReady(startedAt); }, SUPABASE_POLL_INTERVAL_MS);
  }

  async function checkSupabaseStatusOnce() {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    const body = await fetchProjectStatus(stored.ref);
    const outcome = await handleProjectStatusResult(body);
    if (outcome === "pending") {
      supabaseError("err_supabase_provisioning_timeout");
      document.getElementById("supabase-check-status-submit").style.display = "inline-block";
    }
  }

  let currentRenderDeployErrorKey = null;
  const RENDER_DEPLOY_POLL_INTERVAL_MS = 10000;
  const RENDER_DEPLOY_POLL_TIMEOUT_MS = 900000;

  function resetRenderDeploySection() {
    document.getElementById("render-deploy-trigger-section").style.display = "block";
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-done-section").style.display = "none";
    document.getElementById("render-deploy-check-again-submit").style.display = "none";
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
  }

  function renderDeployError(key) {
    setFrameStatus("render-deploy", "error");
    currentRenderDeployErrorKey = key;
    document.getElementById("render-deploy-error").textContent = t(key);
  }

  function renderDeployErrorForReason(reason) {
    const map = {
      invalid_key: "err_render_deploy_invalid_key",
      service_not_found: "err_render_deploy_service_not_found",
      render_unreachable: "err_render_deploy_unreachable",
    };
    renderDeployError(map[reason] || "err_render_deploy_unreachable");
  }

  async function fetchRenderDeployStatus(serviceId, deployId) {
    const apiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!apiKey) return {valid: false, reason: "invalid_key"};
    let resp;
    try {
      resp = await fetch("/api/render/deploy-status", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: apiKey, service_id: serviceId, deploy_id: deployId}),
      });
    } catch (err) {
      return {networkError: true};
    }
    try {
      if (!resp.ok) throw new Error("bad status");
      return await resp.json();
    } catch (err) {
      return {valid: false, reason: "render_unreachable"};
    }
  }

  function finishRenderDeploy() {
    const stored = readStoredRenderService();
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-done-section").style.display = "block";
    const link = document.getElementById("render-deploy-service-link");
    link.href = stored ? stored.service_url : "";
    link.textContent = stored ? stored.service_url : "";
    if (stored) {
      stored.deployed = true;
      sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    }
    completeFrame("render-deploy", null, null);
  }

  function handleRenderDeployStatusResult(body) {
    if (body.networkError) {
      renderDeployError("err_network");
      return "error";
    }
    if (!body.valid) {
      renderDeployErrorForReason(body.reason);
      return "error";
    }
    if (body.status === "live") {
      finishRenderDeploy();
      return "live";
    }
    if (body.status === "failed") {
      document.getElementById("render-deploy-polling-section").style.display = "none";
      renderDeployError("err_render_deploy_failed");
      return "error";
    }
    // "in_progress" and "canceled" both keep polling: canceled means a
    // newer deploy superseded this one, not a failure (same distinction
    // scripts/deploy.py draws), so the right response is to keep
    // watching, not to stop.
    return "pending";
  }

  async function pollRenderDeployStatus(serviceId, deployId, startedAt) {
    const body = await fetchRenderDeployStatus(serviceId, deployId);
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= RENDER_DEPLOY_POLL_TIMEOUT_MS) {
      renderDeployError("err_render_deploy_timeout");
      document.getElementById("render-deploy-check-again-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollRenderDeployStatus(serviceId, deployId, startedAt); }, RENDER_DEPLOY_POLL_INTERVAL_MS);
  }

  async function checkRenderDeployStatusOnce() {
    const stored = readStoredRenderService();
    if (!stored || !stored.service_id || !stored.pending_deploy_id) return;
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const body = await fetchRenderDeployStatus(stored.service_id, stored.pending_deploy_id);
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome === "pending") {
      renderDeployError("err_render_deploy_timeout");
      document.getElementById("render-deploy-check-again-submit").style.display = "inline-block";
    }
  }

  async function triggerRenderDeploy() {
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const apiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    const stored = readStoredRenderService();
    if (!apiKey || !stored || !stored.service_id) {
      renderDeployError("err_render_deploy_no_service");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/render/trigger-deploy", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: apiKey, service_id: stored.service_id}),
      });
    } catch (err) {
      renderDeployError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      renderDeployError("err_render_deploy_unreachable");
      return;
    }
    if (!body.valid) {
      renderDeployErrorForReason(body.reason);
      return;
    }
    stored.pending_deploy_id = body.deploy_id;
    sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    document.getElementById("render-deploy-trigger-section").style.display = "none";
    document.getElementById("render-deploy-polling-section").style.display = "block";
    pollRenderDeployStatus(stored.service_id, body.deploy_id, Date.now());
  }

  async function pushSupabaseToRenderService(stored) {
    const renderService = readStoredRenderService();
    const renderApiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!renderService || !renderService.service_id || !renderApiKey) return;
    try {
      await fetch("/api/supabase/push-render-var", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          render_api_key: renderApiKey,
          render_service_id: renderService.service_id,
          database_url: stored.connection_string,
        }),
      });
    } catch (err) {
      // best-effort -- see pushGithubAppToRenderService's comment above.
    }
    delete stored.connection_string;
  }

  async function fetchSupabaseConnectionInfo() {
    let stored = readStoredSupabase();
    if (!stored || !stored.ref || !stored.db_pass) {
      // Polling already reported "ready" and stopped by this point — a bare
      // return here would leave the frame stuck at "Provisioning…" forever
      // with no error and no button. Also genuinely terminal (missing local
      // state that can't be recovered by waiting), so reset the same way as
      // the other dead ends above.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_callback_invalid");
      return;
    }
    const body = await callSupabaseRelay("/api/supabase/connection-info", {ref: stored.ref});
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return;
    }
    // Re-read AFTER the await, same reason as kickOffProjectCreation: a
    // mid-call token refresh must not be clobbered by a stale pre-await
    // snapshot.
    stored = readStoredSupabase() || stored;
    // Assembled client-side from db_pass (already held) plus the non-secret
    // shape connection-info returned (spec section 3 step 9) — never from
    // Supabase's own connection_string field, whose password-masking
    // behavior cannot be verified from documentation.
    stored.connection_string =
      `postgresql://${body.db_user}:${stored.db_pass}@${body.db_host}:${body.db_port}/${body.db_name}`;
    delete stored.db_pass;
    await pushSupabaseToRenderService(stored);
    stored.completed = true;
    sessionStorage.setItem(STORAGE_KEYS["supabase"], JSON.stringify(stored));
    completeFrame("supabase", "project_prefix", stored.name);
  }

  function restoreFromSession() {
    if (sessionStorage.getItem(STORAGE_KEYS["render-key"])) {
      completeFrame("render-key", "restored", null);
    }
    if (sessionStorage.getItem(STORAGE_KEYS["render-service"])) {
      completeFrame("render-service", "url_prefix", (readStoredRenderService() || {}).service_url);
    }
    const githubApp = readStoredGithubApp();
    if (githubApp && githubApp.installation_id) {
      completeFrame("github-app", "restored", null);
    } else if (githubApp) {
      showGithubAppReadyToInstall();
    }
    const supabaseState = readStoredSupabase();
    if (supabaseState && supabaseState.completed) {
      completeFrame("supabase", "restored", null);
    } else if (supabaseState && supabaseState.ref) {
      showSupabaseProvisioning();
      pollUntilReady(Date.now());
    }
    if (sessionStorage.getItem(STORAGE_KEYS["llm-provider"])) {
      completeFrame("llm-provider", "restored", null);
    }
    if (sessionStorage.getItem(STORAGE_KEYS["uptime-pinger"])) {
      completeFrame("uptime-pinger", "restored", null);
    }
    const renderServiceState = readStoredRenderService();
    if (renderServiceState && renderServiceState.deployed) {
      completeFrame("render-deploy", null, null);
    } else if (renderServiceState && renderServiceState.pending_deploy_id) {
      document.getElementById("render-deploy-trigger-section").style.display = "none";
      document.getElementById("render-deploy-polling-section").style.display = "block";
      pollRenderDeployStatus(renderServiceState.service_id, renderServiceState.pending_deploy_id, Date.now());
    }
  }

  function guardLockedFrames() {
    document.querySelectorAll(".frame").forEach((el) => {
      el.addEventListener("toggle", () => {
        if (el.open && el.dataset.locked === "true") {
          el.open = false;
        }
      });
    });
  }

  function attachChangeButtons() {
    document.querySelectorAll(".frame-change").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        beginChange(btn.dataset.frame);
      });
    });
  }

  function positionPopup(popup, anchorBtn) {
    const margin = 8;
    const rect = anchorBtn.getBoundingClientRect();
    const isRtl = document.documentElement.getAttribute("dir") === "rtl";
    popup.style.top = `${rect.bottom + margin}px`;
    popup.style.left = "auto";
    popup.style.right = "auto";
    const popupWidth = popup.offsetWidth;
    if (isRtl) {
      const maxRight = window.innerWidth - popupWidth - margin;
      const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
      popup.style.right = `${right}px`;
    } else {
      const maxLeft = window.innerWidth - popupWidth - margin;
      const left = Math.max(margin, Math.min(rect.left, maxLeft));
      popup.style.left = `${left}px`;
    }
  }

  function openPopup(id, anchorBtn) {
    closeAllPopups();
    const backdrop = document.getElementById(id);
    backdrop.classList.add("open");
    positionPopup(backdrop.querySelector(".popup"), anchorBtn);
  }

  function closeAllPopups() {
    document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("render-key-submit").addEventListener("click", validateRenderKey);
    document.getElementById("render-service-submit").addEventListener("click", createRenderService);
    document.getElementById("render-deploy-trigger-submit").addEventListener("click", triggerRenderDeploy);
    document.getElementById("render-deploy-check-again-submit").addEventListener("click", checkRenderDeployStatusOnce);
    document.getElementById("github-app-create-submit").addEventListener("click", createGithubApp);
    document.getElementById("github-app-install-submit").addEventListener("click", installGithubApp);
    document.getElementById("github-app-webhook-retry-submit").addEventListener("click", retryGithubWebhookSetup);
    document.getElementById("supabase-connect-submit").addEventListener("click", connectSupabase);
    document.getElementById("supabase-org-submit").addEventListener("click", confirmSupabaseOrg);
    document.getElementById("supabase-check-status-submit").addEventListener("click", checkSupabaseStatusOnce);
    document.getElementById("llm-provider-validate-submit").addEventListener("click", validateLlmProviderCredential);
    document.getElementById("llm-provider-continue-submit").addEventListener("click", confirmLlmProviderModel);
    document.getElementById("uptime-pinger-submit").addEventListener("click", submitUptimeRobotKey);
    document.getElementById("frame-uptime-pinger").addEventListener("toggle", () => {
      if (document.getElementById("frame-uptime-pinger").open) {
        refreshUptimePingerBlockedState();
      }
    });
    document.querySelectorAll('input[name="llm-provider-choice"]').forEach((r) => {
      r.addEventListener("change", handleLlmProviderChoice);
    });
    guardLockedFrames();
    attachChangeButtons();

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));
    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });
    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyTheme(event.target.value); closeAllPopups(); });
    });
    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyLanguage(event.target.value); closeAllPopups(); });
    });

    applyLanguage(currentLang);
    restoreFromSession();
    handleGithubManifestCallback();
    handleGithubInstallCallback();
    handleSupabaseOauthCallback();
  });
</script>
</body>
</html>
