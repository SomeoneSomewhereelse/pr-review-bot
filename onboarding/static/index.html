  // Generated once per page load, kept in memory only (not sessionStorage --
  // it's sent to /api/github/validate-app on success and persisted
  // server-side there; it is not needed locally after that). GitHub's API
  // never returns a webhook secret to check it against, so this value only
  // needs to exist long enough for the visitor to copy it into GitHub's
  // form and for validateGithubApp() to submit it alongside the app
  // credentials. A full page reload before validating regenerates a new
  // value -- the visitor re-pastes it into GitHub's webhook-secret field --
  // an acceptable, recoverable cost given this frame has no cross-domain
  // redirect (the mobile tab-discard problem this whole redesign addresses
  // only ever struck frames that navigate away, which this one no longer
  // does at all).
  let githubAppWebhookSecret = null;
  function ensureGithubAppWebhookSecret() {
    if (!githubAppWebhookSecret) {
      githubAppWebhookSecret = base64UrlEncode(crypto.getRandomValues(new Uint8Array(32)));
    }
    return githubAppWebhookSecret;
  }

  function renderGithubAppInstructions() {
    const renderService = readStoredRenderService();
    const webhookUrl = renderService && renderService.service_url
      ? `${renderService.service_url}/webhook` : "—";
    document.getElementById("github-app-homepage-url").textContent = window.ONBOARDING_BASE_URL;
    document.getElementById("github-app-webhook-url").textContent = webhookUrl;
    document.getElementById("github-app-webhook-secret").textContent = ensureGithubAppWebhookSecret();
    const ACCESS_LABELS = {read: t("frame2_access_read"), write: t("frame2_access_write")};
    const tbody = document.getElementById("github-app-permissions-table-body");
    tbody.innerHTML = "";
    Object.entries(REQUIRED_PERMISSIONS).forEach(([name, level]) => {
      const tr = document.createElement("tr");
      const nameTd = document.createElement("td");
      nameTd.textContent = name;
      const accessTd = document.createElement("td");
      accessTd.textContent = ACCESS_LABELS[level] || level;
      tr.appendChild(nameTd);
      tr.appendChild(accessTd);
      tbody.appendChild(tr);
    });
  }

  async function validateGithubApp() {
    document.getElementById("github-app-error").textContent = "";
    currentGithubAppErrorKey = null;
    document.getElementById("github-app-checklist").innerHTML = "";
    const renderService = readStoredRenderService();
    if (!renderService || !renderService.service_url) {
      githubAppError("err_github_no_render_service");
      return;
    }
    const appIdRaw = document.getElementById("github-app-id-input").value.trim();
    if (!/^[0-9]+$/.test(appIdRaw) || Number(appIdRaw) <= 0) {
      githubAppError("err_github_app_id_invalid");
      return;
    }
    const fileInput = document.getElementById("github-app-key-file-input");
    const file = fileInput.files[0];
    if (!file) {
      githubAppError("err_github_no_file");
      return;
    }
    let privateKeyB64;
    try {
      privateKeyB64 = await readFileAsBase64(file);
    } catch (err) {
      githubAppError("err_github_invalid_key_file");
      return;
    }
    const btn = document.getElementById("github-app-validate-submit");
    btn.disabled = true;
    setFrameStatus("github-app", "checking");
    const expectedWebhookUrl = `${renderService.service_url}/webhook`;
    let resp;
    try {
      resp = await fetch("/api/github/validate-app", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          app_id: Number(appIdRaw),
          private_key_b64: privateKeyB64,
          expected_webhook_url: expectedWebhookUrl,
          webhook_secret: ensureGithubAppWebhookSecret(),
        }),
      });
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_github_unreachable");
      return;
    }
    btn.disabled = false;
    if (!body.valid) {
      setFrameStatus("github-app", "error");
      if (body.reason === "unauthorized") {
        githubAppError("err_github_invalid_credentials");
      } else if (body.reason === "invalid_key") {
        githubAppError("err_github_invalid_key_file");
      } else {
        githubAppError("err_github_unreachable");
      }
      return;
    }
    renderGithubAppChecklist(body);
    if (!body.all_ok) {
      setFrameStatus("github-app", "error");
      return;
    }
    // Already persisted server-side by /api/github/validate-app on success
    // (session_store, keyed by this frame's session cookie) -- nothing left
    // to store client-side.
    completeFrame("github-app", "account_prefix", body.installation.account_login);
  }

  function renderGithubAppChecklist(body) {
    const list = document.getElementById("github-app-checklist");
    list.innerHTML = "";
    const addRow = (label, ok) => {
      const li = document.createElement("li");
      li.className = ok ? "check-pass" : "check-fail";
      li.textContent = `${ok ? "✓" : "✗"} ${label}`;
      list.appendChild(li);
    };
    body.permissions.forEach((p) => {
      addRow(`${p.name}: ${p.wanted}${p.ok ? "" : ` (have: ${p.actual || "none"})`}`, p.ok);
    });
    body.events.forEach((e) => {
      addRow(`${t("frame2_check_event_prefix")}${e.name}`, e.ok);
    });
    if (body.installation.status === "found") {
      addRow(`${t("frame2_check_installation_found_prefix")}${body.installation.account_login}`, true);
    } else if (body.installation.status === "multiple") {
      addRow(t("frame2_check_installation_multiple"), false);
    } else {
      addRow(t("frame2_check_installation_none"), false);
    }
    addRow(t("frame2_check_webhook"), body.webhook.ok);
  }

  function base64UrlEncode(bytes) {
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function resetSupabaseConnectSection() {
    supabasePollGeneration++;
    document.getElementById("supabase-org-section").style.display = "none";
    document.getElementById("supabase-provisioning-section").style.display = "none";
    document.getElementById("supabase-check-status-submit").style.display = "none";
    document.getElementById("supabase-connect-section").style.display = "block";
    document.getElementById("supabase-error").textContent = "";
    document.getElementById("supabase-org-submit").disabled = false;
    currentSupabaseErrorKey = null;
  }

  function supabaseError(key) {
    setFrameStatus("supabase", "error");
    currentSupabaseErrorKey = key;
    document.getElementById("supabase-error").textContent = t(key);
  }

  function supabaseErrorForReason(reason, message) {
    if (reason === "project_creation_rejected" && message) {
      // Terminal: the org was picked and project creation was rejected for
      // a business reason (e.g. a free-tier project cap) that retrying the
      // same request won't fix. Reset first so "Connect Supabase" is back
      // on screen for the visitor to restart, THEN show the error —
      // resetSupabaseConnectSection() clears #supabase-error's text too.
      resetSupabaseConnectSection();
      // Supabase's own error text, relayed verbatim (spec section 4) —
      // not a translated string, since it isn't one of ours.
      setFrameStatus("supabase", "error");
      currentSupabaseErrorKey = null;
      document.getElementById("supabase-error").textContent = message;
      return;
    }
    // "unauthorized" means the server's stored access_token is dead
    // (Supabase revoked it) -- terminal, since nothing left on screen can
    // retry with the same session. "no_session" means the server has no
    // record of this frame's OAuth step at all (e.g. a session that
    // expired) -- also terminal, same reset.
    if (reason === "unauthorized" || reason === "no_session") {
      resetSupabaseConnectSection();
    }
    const key = {
      unauthorized: "err_supabase_reauthorize",
      no_session: "err_no_session",
      forbidden: "err_supabase_forbidden",
      rate_limited: "err_supabase_rate_limited",
      pooler_config_unavailable: "err_supabase_pooler_config_unavailable",
    }[reason] || "err_supabase_unreachable";
    supabaseError(key);
  }

  // Every Supabase relay call after the initial OAuth redirect goes through
  // here. access_token never reaches the browser at all anymore (the server
  // reads it from the session, keyed by the onboarding_session cookie sent
  // automatically with every same-origin fetch) -- no client-side refresh
  // logic is needed either, since the server always uses its own
  // up-to-date stored token.
  async function callSupabaseRelay(endpoint, payload) {
    try {
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload || {}),
      });
      if (!resp.ok) throw new Error("bad status");
      return await resp.json();
    } catch (err) {
      return {valid: false, reason: "supabase_unreachable"};
    }
  }

  // Paste-and-validate, same shape as validateRenderKey() above: the PAT
  // is submitted once, validated server-side, and persisted into the
  // session on success (POST /api/supabase/validate-key) -- it never
  // touches sessionStorage/localStorage. Every later Supabase call in
  // this frame goes through callSupabaseRelay(), which sends no
  // credential at all (the server reads it back from the session).
  async function validateSupabaseKey() {
    const input = document.getElementById("supabase-key-input");
    const key = input.value.trim();
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    if (!key) {
      supabaseError("err_supabase_empty_key");
      return;
    }
    setFrameStatus("supabase", "checking");
    const submitBtn = document.getElementById("supabase-key-submit");
    submitBtn.disabled = true;
    let resp, body;
    try {
      resp = await fetch("/api/supabase/validate-key", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key}),
      });
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      setFrameStatus("supabase", "ready");
      submitBtn.disabled = false;
      supabaseError("err_network");
      return;
    }
    if (!body.valid) {
      setFrameStatus("supabase", "ready");
      submitBtn.disabled = false;
      if (body.reason === "invalid_key") {
        supabaseError("err_supabase_invalid_key");
      } else {
        supabaseErrorForReason(body.reason);
      }
      return;
    }
    input.value = "";
    if (body.orgs.length === 0) {
      resetSupabaseConnectSection();
      supabaseError("err_supabase_no_organizations");
      return;
    }
    const select = document.getElementById("supabase-org-select");
    select.innerHTML = "";
    body.orgs.forEach((org) => {
      const option = document.createElement("option");
      option.value = org.slug;
      option.textContent = org.name;
      select.appendChild(option);
    });
    showSupabaseOrgSection();
  }

  function showSupabaseOrgSection() {
    document.getElementById("supabase-connect-section").style.display = "none";
    document.getElementById("supabase-org-section").style.display = "block";
    frameEl("supabase").open = true;
    setFrameStatus("supabase", "choosing_org");
  }

  async function confirmSupabaseOrg() {
    const select = document.getElementById("supabase-org-select");
    const nameInput = document.getElementById("supabase-project-name-input");
    const name = nameInput.value.trim();
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    if (!name) {
      supabaseError("err_supabase_name_empty");
      return;
    }
    const submitBtn = document.getElementById("supabase-org-submit");
    submitBtn.disabled = true;
    const ok = await kickOffProjectCreation(select.value, name);
    if (!ok) submitBtn.disabled = false;
  }

  async function kickOffProjectCreation(organizationSlug, name) {
    const body = await callSupabaseRelay("/api/supabase/create-project", {
      organization_slug: organizationSlug,
      name,
    });
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return false;
    }
    // Non-secret continuity state for this page view (polling needs `ref`;
    // the final completeFrame call needs `name`) -- not a credential, so
    // sessionStorage is fine here. db_pass/api_key never reach the
    // browser at all now (session_store.py holds them server-side).
    try {
      sessionStorage.setItem(
        STORAGE_KEYS["supabase"],
        JSON.stringify({name: body.name, ref: body.ref, status: body.status}),
      );
    } catch (err) {
      supabaseError("err_supabase_storage_failed");
      return false;
    }
    showSupabaseProvisioning();
    pollUntilReady(Date.now(), supabasePollGeneration);
    return true;
  }

  function showSupabaseProvisioning() {
    document.getElementById("supabase-connect-section").style.display = "none";
    document.getElementById("supabase-org-section").style.display = "none";
    document.getElementById("supabase-provisioning-section").style.display = "block";
    frameEl("supabase").open = true;
    setFrameStatus("supabase", "provisioning");
  }

  const SUPABASE_POLL_INTERVAL_MS = 5000;
  const SUPABASE_POLL_TIMEOUT_MS = 300000;

  async function handleProjectStatusResult(body) {
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return "error";
    }
    if (body.status === "ACTIVE_HEALTHY") {
      await fetchSupabaseConnectionInfo();
      return "ready";
    }
    if (body.status === "INIT_FAILED") {
      // Terminal, unlike the poll-timeout case: the project will never
      // become healthy on its own, so put "Connect Supabase" back on
      // screen rather than leaving the provisioning section's dead end up.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_provisioning_failed");
      return "error";
    }
    return "pending";
  }

  async function fetchProjectStatus() {
    return await callSupabaseRelay("/api/supabase/project-status");
  }

  async function pollUntilReady(startedAt, generation) {
    if (generation !== supabasePollGeneration) return;
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    const body = await fetchProjectStatus();
    if (generation !== supabasePollGeneration) return;
    const outcome = await handleProjectStatusResult(body);
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= SUPABASE_POLL_TIMEOUT_MS) {
      supabaseError("err_supabase_provisioning_timeout");
      document.getElementById("supabase-check-status-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollUntilReady(startedAt, generation); }, SUPABASE_POLL_INTERVAL_MS);
  }

  async function checkSupabaseStatusOnce() {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) return;
    document.getElementById("supabase-error").textContent = "";
    currentSupabaseErrorKey = null;
    const checkAgainBtn = document.getElementById("supabase-check-status-submit");
    checkAgainBtn.disabled = true;
    const generation = supabasePollGeneration;
    const body = await fetchProjectStatus();
    if (generation !== supabasePollGeneration) return;
    const outcome = await handleProjectStatusResult(body);
    if (outcome === "pending") {
      supabaseError("err_supabase_provisioning_timeout");
      checkAgainBtn.style.display = "inline-block";
      checkAgainBtn.disabled = false;
    }
  }

  let currentRenderDeployErrorKey = null;
  const RENDER_DEPLOY_POLL_INTERVAL_MS = 10000;
  const RENDER_DEPLOY_POLL_TIMEOUT_MS = 900000;

  function resetRenderDeploySection() {
    renderDeployPollGeneration++;
    document.getElementById("render-deploy-trigger-section").style.display = "block";
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-done-section").style.display = "none";
    document.getElementById("render-deploy-check-again-submit").style.display = "none";
    document.getElementById("render-deploy-check-again-submit").disabled = false;
    document.getElementById("render-deploy-trigger-submit").disabled = false;
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
  }

  function renderDeployError(key) {
    setFrameStatus("render-deploy", "error");
    currentRenderDeployErrorKey = key;
    document.getElementById("render-deploy-error").textContent = t(key);
  }

  function renderDeployErrorForReason(reason) {
    const map = {
      invalid_key: "err_render_deploy_invalid_key",
      service_not_found: "err_render_deploy_service_not_found",
      render_unreachable: "err_render_deploy_unreachable",
    };
    renderDeployError(map[reason] || "err_render_deploy_unreachable");
  }

  async function fetchRenderDeployStatus() {
    let resp;
    try {
      resp = await fetch("/api/render/deploy-status", {method: "POST"});
    } catch (err) {
      return {networkError: true};
    }
    try {
      if (!resp.ok) throw new Error("bad status");
      return await resp.json();
    } catch (err) {
      return {valid: false, reason: "render_unreachable"};
    }
  }

  function finishRenderDeploy() {
    const stored = readStoredRenderService();
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-done-section").style.display = "block";
    const link = document.getElementById("render-deploy-service-link");
    link.href = stored ? stored.service_url : "";
    link.textContent = stored ? stored.service_url : "";
    if (stored) {
      stored.deployed = true;
      sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    }
    // Unlike every other frame, this one stays open after completion: it's
    // the last frame, so there's no next step to draw attention to, and the
    // dashboard link just written above is the actual payoff -- collapsing
    // it here would hide the one thing worth seeing at the end of the wizard.
    completeFrame("render-deploy", null, null, "deploy_done", true);
    renderDeployCompletedOnce = true;
  }

  function showRenderDeployTriggerAgain() {
    document.getElementById("render-deploy-polling-section").style.display = "none";
    document.getElementById("render-deploy-trigger-section").style.display = "block";
    document.getElementById("render-deploy-trigger-submit").disabled = false;
  }

  function handleRenderDeployStatusResult(body) {
    if (body.networkError) {
      renderDeployError("err_network");
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (!body.valid) {
      renderDeployErrorForReason(body.reason);
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (body.status === "live") {
      finishRenderDeploy();
      return "live";
    }
    if (body.status === "failed") {
      renderDeployError("err_render_deploy_failed");
      showRenderDeployTriggerAgain();
      return "error";
    }
    if (body.status === "canceled") {
      renderDeployError("err_render_deploy_canceled");
      showRenderDeployTriggerAgain();
      return "error";
    }
    // Only "in_progress" keeps polling now.
    return "pending";
  }

  async function pollRenderDeployStatus(startedAt, generation) {
    if (generation !== renderDeployPollGeneration) return;
    const body = await fetchRenderDeployStatus();
    if (generation !== renderDeployPollGeneration) return;
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome !== "pending") return;
    if (Date.now() - startedAt >= RENDER_DEPLOY_POLL_TIMEOUT_MS) {
      renderDeployError("err_render_deploy_timeout");
      document.getElementById("render-deploy-check-again-submit").style.display = "inline-block";
      return;
    }
    setTimeout(() => { pollRenderDeployStatus(startedAt, generation); }, RENDER_DEPLOY_POLL_INTERVAL_MS);
  }

  async function checkRenderDeployStatusOnce() {
    const stored = readStoredRenderService();
    if (!stored || !stored.service_id || !stored.pending_deploy_id) return;
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const checkAgainBtn = document.getElementById("render-deploy-check-again-submit");
    checkAgainBtn.disabled = true;
    const generation = renderDeployPollGeneration;
    const body = await fetchRenderDeployStatus();
    if (generation !== renderDeployPollGeneration) return;
    const outcome = handleRenderDeployStatusResult(body);
    if (outcome === "pending") {
      renderDeployError("err_render_deploy_timeout");
      checkAgainBtn.style.display = "inline-block";
      checkAgainBtn.disabled = false;
    }
  }

  async function triggerRenderDeploy() {
    document.getElementById("render-deploy-error").textContent = "";
    currentRenderDeployErrorKey = null;
    const stored = readStoredRenderService();
    if (!stored || !stored.service_id) {
      renderDeployError("err_render_deploy_no_service");
      return;
    }
    const triggerBtn = document.getElementById("render-deploy-trigger-submit");
    triggerBtn.disabled = true;
    // Bulk-pushes every completed frame's env vars to the visitor's Render
    // service in one call before triggering deploy -- no earlier frame
    // pushed incrementally anymore.
    let pushResp, pushBody;
    try {
      pushResp = await fetch("/api/render/bulk-push-env-vars", {method: "POST"});
      if (!pushResp.ok) throw new Error("bad status");
      pushBody = await pushResp.json();
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_network");
      return;
    }
    if (!pushBody.valid) {
      triggerBtn.disabled = false;
      renderDeployErrorForReason(pushBody.reason);
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/render/trigger-deploy", {method: "POST"});
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      triggerBtn.disabled = false;
      renderDeployError("err_render_deploy_unreachable");
      return;
    }
    if (!body.valid) {
      triggerBtn.disabled = false;
      renderDeployErrorForReason(body.reason);
      return;
    }
    stored.pending_deploy_id = body.deploy_id;
    sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify(stored));
    document.getElementById("render-deploy-trigger-section").style.display = "none";
    document.getElementById("render-deploy-polling-section").style.display = "block";
    setFrameStatus("render-deploy", "deploying");
    pollRenderDeployStatus(Date.now(), renderDeployPollGeneration);
  }

  async function fetchSupabaseConnectionInfo() {
    const stored = readStoredSupabase();
    if (!stored || !stored.ref) {
      // Polling already reported "ready" and stopped by this point — a bare
      // return here would leave the frame stuck at "Provisioning…" forever
      // with no error and no button. Also genuinely terminal (missing local
      // state that can't be recovered by waiting), so reset the same way as
      // the other dead ends above.
      resetSupabaseConnectSection();
      supabaseError("err_supabase_callback_invalid");
      return;
    }
    // Assembles and stores the full DATABASE_URL server-side now (db_pass
    // never left the server to begin with) -- this call returns only a
    // verdict, never db_user/db_host/db_port/db_name.
    const body = await callSupabaseRelay("/api/supabase/connection-info");
    if (!body.valid) {
      supabaseErrorForReason(body.reason, body.message);
      return;
    }
    completeFrame("supabase", "project_prefix", stored.name);
  }

  // Server-driven now, not a sessionStorage read: GET /api/session is the
  // source of truth for which frames are already done (session_store.py,
  // identified by the onboarding_session cookie -- survives a mobile
  // browser destroying this tab's sessionStorage, which is the whole
  // reason this wizard moved off the earlier stateless-relay design). Any
  // frame reflected here mirrors its own non-secret display fields into
  // the local per-frame sessionStorage record afterward, purely so later
  // same-page-load code (e.g. github-app's webhook URL instructions, the
  // render-deploy frame) can keep reading that local record the way it
  // already does after a fresh in-page completion.
  async function restoreFromSession() {
    let body;
    try {
      const resp = await fetch("/api/session");
      body = await resp.json();
    } catch (err) {
      return; // treat a network failure on load like a fresh visitor
    }
    const frames = body.frames || {};

    if (frames["render-key"]) {
      completeFrame("render-key", "owner_prefix", frames["render-key"].display.owner_name);
    }
    if (frames["render-service"]) {
      const {service_id: serviceId, service_url: serviceUrl} = frames["render-service"].display;
      // Merge onto whatever's already in the local mirror rather than
      // replacing it outright -- on an ordinary same-tab reload (as
      // opposed to the mobile tab-discard case this whole restore path
      // exists for), sessionStorage already has this frame's own
      // `deployed`/`pending_deploy_id` fields from earlier in the same
      // browsing session; overwriting unconditionally would discard
      // render-deploy's resumable state on every normal reload, not just
      // the tab-discard one.
      try {
        const existing = readStoredRenderService() || {};
        sessionStorage.setItem(
          STORAGE_KEYS["render-service"],
          JSON.stringify({...existing, service_id: serviceId, service_url: serviceUrl}),
        );
        sessionStorage.setItem(RENDER_SERVICE_URL_KEY, serviceUrl);
      } catch (err) {
        // best-effort -- the frame still shows as complete this page view
        // even if the local mirror can't be written.
      }
      completeFrame("render-service", "url_prefix", serviceUrl);
    }
    if (frames["dashboard-auth"]) {
      completeFrame("dashboard-auth", "restored", null);
    }
    if (frames["github-app"]) {
      completeFrame("github-app", "restored", null);
    }
    const supabaseFrame = frames["supabase"];
    if (supabaseFrame && supabaseFrame.complete) {
      completeFrame("supabase", "project_prefix", supabaseFrame.display.name);
    } else if (supabaseFrame && supabaseFrame.provisioning) {
      // Project created, but connection-info hasn't completed yet --
      // resume the provisioning poll where it left off. The local mirror
      // needs {ref} for pollUntilReady()/fetchSupabaseConnectionInfo()'s
      // own readStoredSupabase() checks, and {name} for the eventual
      // completeFrame() call.
      try {
        sessionStorage.setItem(
          STORAGE_KEYS["supabase"],
          JSON.stringify({ref: supabaseFrame.display.ref, name: supabaseFrame.display.name}),
        );
      } catch (err) {
        // best-effort -- falls through to showing the frame as ready to
        // provision again if the mirror can't be written.
      }
      showSupabaseProvisioning();
      pollUntilReady(Date.now(), supabasePollGeneration);
    }
    if (frames["llm-provider"]) {
      const provider = frames["llm-provider"].display.provider;
      completeFrame("llm-provider", "provider_prefix", LLM_PROVIDER_LABEL_KEY[provider] || provider);
    }
    if (frames["uptime-pinger"]) {
      completeFrame("uptime-pinger", "restored", null);
    }

    // render-deploy resumption stays local-only: it isn't part of
    // GET /api/session (deploy progress is tracked live via polling, not
    // meaningfully "restorable" as instantly done), and the render-service
    // mirror written just above already carries what it needs.
    const renderServiceState = readStoredRenderService();
    if (renderServiceState && renderServiceState.deployed) {
      document.getElementById("render-deploy-polling-section").style.display = "none";
      document.getElementById("render-deploy-done-section").style.display = "block";
      const link = document.getElementById("render-deploy-service-link");
      link.href = renderServiceState.service_url || "";
      link.textContent = renderServiceState.service_url || "";
      completeFrame("render-deploy", null, null, "deploy_done", true);
      renderDeployCompletedOnce = true;
    } else if (renderServiceState && renderServiceState.pending_deploy_id) {
      document.getElementById("render-deploy-trigger-section").style.display = "none";
      document.getElementById("render-deploy-polling-section").style.display = "block";
      setFrameStatus("render-deploy", "deploying");
      pollRenderDeployStatus(Date.now(), renderDeployPollGeneration);
    }
  }

  function guardLockedFrames() {
    document.querySelectorAll(".frame").forEach((el) => {
      // Prevent the native <details> toggle before it happens -- a locked
      // frame must never visibly open at all, not open-then-flicker-closed.
      const summary = el.querySelector("summary");
      if (summary) {
        summary.addEventListener("click", (event) => {
          if (el.dataset.locked === "true") event.preventDefault();
        });
      }
      // Kept as defense-in-depth for any non-click path that can still set
      // `.open` (e.g. programmatic toggling from outside this guard).
      el.addEventListener("toggle", () => {
        if (el.open && el.dataset.locked === "true") {
          el.open = false;
        }
      });
    });
  }

  function attachChangeButtons() {
    document.querySelectorAll(".frame-change").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        beginChange(btn.dataset.frame);
      });
    });
  }

  function positionPopup(popup, anchorBtn) {
    const margin = 8;
    const rect = anchorBtn.getBoundingClientRect();
    const isRtl = document.documentElement.getAttribute("dir") === "rtl";
    popup.style.top = `${rect.bottom + margin}px`;
    popup.style.left = "auto";
    popup.style.right = "auto";
    const popupWidth = popup.offsetWidth;
    if (isRtl) {
      const maxRight = window.innerWidth - popupWidth - margin;
      const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
      popup.style.right = `${right}px`;
    } else {
      const maxLeft = window.innerWidth - popupWidth - margin;
      const left = Math.max(margin, Math.min(rect.left, maxLeft));
      popup.style.left = `${left}px`;
    }
  }

  function openPopup(id, anchorBtn) {
    closeAllPopups();
    const backdrop = document.getElementById(id);
    backdrop.classList.add("open");
    positionPopup(backdrop.querySelector(".popup"), anchorBtn);
  }

  function closeAllPopups() {
    document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("render-key-submit").addEventListener("click", validateRenderKey);
    document.getElementById("render-key-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter") validateRenderKey();
    });
    document.getElementById("render-service-submit").addEventListener("click", createRenderService);
    document.getElementById("dashboard-auth-submit").addEventListener("click", submitDashboardAuth);
    document.getElementById("dashboard-auth-generate-submit").addEventListener("click", fillGeneratedDashboardAuthPassword);
    document.getElementById("dashboard-auth-password-toggle").addEventListener("click", toggleDashboardAuthPasswordVisibility);
    document.querySelectorAll(".copy-btn").forEach((button) => {
      button.addEventListener("click", () => copyValueToClipboard(button));
    });
    document.getElementById("render-deploy-trigger-submit").addEventListener("click", triggerRenderDeploy);
    document.getElementById("render-deploy-check-again-submit").addEventListener("click", checkRenderDeployStatusOnce);
    document.getElementById("github-app-validate-submit").addEventListener("click", validateGithubApp);
    document.getElementById("supabase-key-submit").addEventListener("click", validateSupabaseKey);
    document.getElementById("supabase-org-submit").addEventListener("click", confirmSupabaseOrg);
    document.getElementById("supabase-check-status-submit").addEventListener("click", checkSupabaseStatusOnce);
    document.getElementById("llm-provider-validate-submit").addEventListener("click", validateLlmProviderCredential);
    document.getElementById("llm-provider-continue-submit").addEventListener("click", confirmLlmProviderModel);
    document.getElementById("uptime-pinger-submit").addEventListener("click", submitUptimeRobotKey);
    document.getElementById("frame-uptime-pinger").addEventListener("toggle", () => {
      if (document.getElementById("frame-uptime-pinger").open) {
        refreshUptimePingerBlockedState();
      }
    });
    document.querySelectorAll('input[name="llm-provider-choice"]').forEach((r) => {
      r.addEventListener("change", handleLlmProviderChoice);
    });
    guardLockedFrames();
    attachChangeButtons();

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));
    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });
    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyTheme(event.target.value); closeAllPopups(); });
    });
    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => { applyLanguage(event.target.value); closeAllPopups(); });
    });

    applyLanguage(currentLang);
    restoreFromSession();

    document.getElementById("wizard-reset-button").addEventListener("click", () => {
      document.getElementById("wizard-reset-confirm-dialog").showModal();
    });
    document.getElementById("wizard-reset-confirm-yes").addEventListener("click", resetWizard);
    document.getElementById("wizard-reset-confirm-no").addEventListener("click", () => {
      document.getElementById("wizard-reset-confirm-dialog").close();
    });
  });
</script>
</body>
