<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your own reviewer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1f2933;
    --text-muted: #5c6773;
    --border: #dde2e7;
    --accent: #3a6ea5;
    --ok: #2f7d4f;
    --fail: #b3454b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161b;
      --surface: #1a1f26;
      --surface-2: #22282f;
      --text: #e6e9ec;
      --text-muted: #9aa5b1;
      --border: #2b323a;
      --accent: #7ba7d9;
      --ok: #5fbf87;
      --fail: #e08086;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #22282f;
    --text: #e6e9ec;
    --text-muted: #9aa5b1;
    --border: #2b323a;
    --accent: #7ba7d9;
    --ok: #5fbf87;
    --fail: #e08086;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
    min-height: 2.5rem;
  }
  button.control:hover { border-color: var(--accent); }
  .popup-backdrop { position: fixed; inset: 0; background: transparent; display: none; z-index: 10; }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.5rem; }
  p.lede { color: var(--text-muted); }
  details.frame {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }
  details.frame > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1.1rem;
  }
  details.frame[data-locked="true"] { opacity: 0.55; }
  details.frame[data-locked="true"] > summary { cursor: not-allowed; color: var(--text-muted); }
  details.frame[data-status="done"] > summary,
  details.frame[data-status="deploy_done"] > summary { cursor: default; color: var(--text); }
  details.frame > summary::-webkit-details-marker { display: none; }
  .frame-title { font-weight: 600; }
  .frame-badge { font-size: 0.85rem; color: var(--text-muted); }
  /* flex-basis: 100% forces this onto its own line below the title/badge/
     Change-button row, however long the detail text (an owner name, a URL)
     gets, instead of wrapping and pushing the Change button down with it. */
  .frame-detail { flex-basis: 100%; font-size: 0.85rem; color: var(--text-muted); }
  details.frame[data-status="done"] .frame-badge,
  details.frame[data-status="done"] .frame-detail,
  details.frame[data-status="deploy_done"] .frame-badge,
  details.frame[data-status="deploy_done"] .frame-detail { color: var(--ok); }
  details.frame[data-status="error"] .frame-badge,
  details.frame[data-status="error"] .frame-detail { color: var(--fail); }
  details.frame[data-status="app_created"] .frame-badge,
  details.frame[data-status="app_created"] .frame-detail,
  details.frame[data-status="choosing_org"] .frame-badge,
  details.frame[data-status="choosing_org"] .frame-detail,
  details.frame[data-status="checking"] .frame-badge,
  details.frame[data-status="checking"] .frame-detail,
  details.frame[data-status="provisioning"] .frame-badge,
  details.frame[data-status="provisioning"] .frame-detail { color: var(--accent); }
  .frame-change {
    display: none;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  details.frame[data-status="done"] .frame-change { display: inline-block; }
  .frame-body { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
  .frame-body input[type="password"], .frame-body input[type="text"], .frame-body select {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    min-height: 2.5rem;
  }
  .frame-body button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    min-height: 2.5rem;
    cursor: pointer;
  }
  /* Password input with the reveal control sitting inside it. The container
     owns the vertical spacing and the input's own margin is zeroed, so the
     absolutely positioned button can stretch top-to-bottom and centre its
     icon without depending on where that margin lands. Logical properties
     (inset-inline-end / padding-inline-end) put the control on the correct
     side automatically under the Hebrew RTL direction. */
  .frame-body .password-field { position: relative; margin: 0.5rem 0; }
  .frame-body .password-field input { margin: 0; padding-inline-end: 2.75rem; }
  .frame-body .password-toggle {
    position: absolute;
    inset-inline-end: 0.35rem;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    min-height: 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .frame-body .password-toggle:hover { color: var(--text); }
  .frame-body .password-toggle svg { width: 1.15rem; height: 1.15rem; display: block; }
  .frame-body .password-toggle svg[hidden] { display: none; }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }
  .checkbox-row input[type="checkbox"] { margin: 0.15rem 0 0; flex: none; }
  .frame-error { color: var(--fail); min-height: 1.2em; }
  @media (max-width: 480px) {
    header.topbar { justify-content: center; }
    details.frame > summary { padding: 0.75rem 0.9rem; }
    .frame-change { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog" aria-label="Theme"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog" aria-label="Language"></button>
  </header>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> 🇺🇸 English</label>
        <label><input type="radio" name="lang" value="he"> 🇮🇱 עברית</label>
      </div>
    </div>
  </div>

  <main>
    <h1 data-i18n="heading"></h1>
    <p class="lede" data-i18n="lede"></p>

    <details id="frame-render-key" class="frame" data-status="ready" data-locked="false" open>
      <summary>
        <span class="frame-title" data-i18n="frame1_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-key" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame1_instructions"></p>
        <input id="render-key-input" type="password" autocomplete="off">
        <button id="render-key-submit" type="button" data-i18n="validate_button"></button>
        <p id="render-key-error" class="frame-error" aria-live="polite"></p>
      </div>
    </details>

    <details id="frame-render-service" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame_render_service_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="render-service" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame_render_service_instructions"></p>
        <label data-i18n="frame_render_service_repo_label"></label>
        <input id="render-service-repo-input" type="text">
        <label data-i18n="frame_render_service_name_label"></label>
        <input id="render-service-name-input" type="text">
        <button id="render-service-submit" type="button" data-i18n="create_service_button"></button>
        <p id="render-service-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-dashboard-auth" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame_dashboard_auth_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="dashboard-auth" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame_dashboard_auth_instructions"></p>
        <label data-i18n="frame_dashboard_auth_username_label"></label>
        <input id="dashboard-auth-username-input" type="text" autocomplete="off">
        <label data-i18n="frame_dashboard_auth_password_label"></label>
        <div class="password-field">
          <input id="dashboard-auth-password-input" type="password" autocomplete="off">
          <button id="dashboard-auth-password-toggle" class="password-toggle" type="button">
            <svg id="dashboard-auth-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="dashboard-auth-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <button id="dashboard-auth-generate-submit" type="button" data-i18n="generate_password_button"></button>
        <button id="dashboard-auth-submit" type="button" data-i18n="save_continue_button"></button>
        <label class="checkbox-row">
          <input id="dashboard-auth-ack-checkbox" type="checkbox">
          <span data-i18n="dashboard_auth_ack_label"></span>
        </label>
        <p id="dashboard-auth-error" class="frame-error" aria-live="polite"></p>
      </div>
    </details>

    <details id="frame-github-app" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame2_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="github-app" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="github-app-create-section">
          <p data-i18n="frame2_instructions"></p>
          <input id="github-app-name-input" type="text">
          <button id="github-app-create-submit" type="button" data-i18n="create_app_button"></button>
        </div>
        <div id="github-app-install-section" style="display: none;">
          <p data-i18n="frame2_install_instructions"></p>
          <p data-i18n="frame2_install_then"></p>
          <label data-i18n="frame2_installation_id_label"></label>
          <input id="github-app-installation-id-input" type="text" inputmode="numeric"
                 autocomplete="off">
          <button id="github-app-install-submit" type="button" data-i18n="install_done_button"></button>
        </div>
        <p id="github-app-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-supabase" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame3_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="supabase" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="supabase-connect-section">
          <p data-i18n="frame3_instructions"></p>
          <input id="supabase-project-name-input" type="text">
          <button id="supabase-connect-submit" type="button" data-i18n="connect_supabase_button"></button>
        </div>
        <div id="supabase-org-section" style="display: none;">
          <p data-i18n="frame3_org_instructions"></p>
          <select id="supabase-org-select"></select>
          <button id="supabase-org-submit" type="button" data-i18n="create_project_button"></button>
        </div>
        <div id="supabase-provisioning-section" style="display: none;">
          <p data-i18n="frame3_provisioning"></p>
          <button id="supabase-check-status-submit" type="button" data-i18n="check_again_button" style="display: none;"></button>
        </div>
        <p id="supabase-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-llm-provider" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame4_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="llm-provider" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <p data-i18n="frame4_instructions"></p>
        <div class="radio-group">
          <label><input type="radio" name="llm-provider-choice" value="gemini" id="llm-provider-choice-gemini"> <span data-i18n="frame4_provider_gemini"></span></label>
          <label><input type="radio" name="llm-provider-choice" value="groq" id="llm-provider-choice-groq"> <span data-i18n="frame4_provider_groq"></span></label>
          <label><input type="radio" name="llm-provider-choice" value="vertex" id="llm-provider-choice-vertex"> <span data-i18n="frame4_provider_vertex"></span></label>
        </div>
        <input id="llm-provider-api-key-input" type="password" style="display: none;">
        <input id="llm-provider-file-input" type="file" accept="application/json" style="display: none;">
        <button id="llm-provider-validate-submit" type="button" data-i18n="validate_button" style="display: none;"></button>
        <div id="llm-provider-model-section" style="display: none;">
          <p data-i18n="frame4_model_instructions"></p>
          <select id="llm-provider-model-select"></select>
          <button id="llm-provider-continue-submit" type="button" data-i18n="continue_button"></button>
        </div>
        <p id="llm-provider-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-uptime-pinger" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame5_title"></span>
        <span class="frame-badge"></span>
        <button class="frame-change" type="button" data-frame="uptime-pinger" data-i18n="change_button"></button>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="uptime-pinger-blocked-section">
          <p data-i18n="frame5_blocked_no_render_url"></p>
        </div>
        <div id="uptime-pinger-form-section" style="display: none;">
          <p data-i18n="frame5_instructions"></p>
          <input id="uptime-pinger-api-key-input" type="password">
          <button id="uptime-pinger-submit" type="button" data-i18n="validate_button"></button>
        </div>
        <p id="uptime-pinger-error" class="frame-error"></p>
      </div>
    </details>

    <details id="frame-render-deploy" class="frame" data-status="locked" data-locked="true">
      <summary>
        <span class="frame-title" data-i18n="frame6_title"></span>
        <span class="frame-badge"></span>
        <span class="frame-detail"></span>
      </summary>
      <div class="frame-body">
        <div id="render-deploy-trigger-section">
          <p data-i18n="frame6_instructions"></p>
          <button id="render-deploy-trigger-submit" type="button" data-i18n="deploy_button"></button>
        </div>
        <div id="render-deploy-polling-section" style="display: none;">
          <p data-i18n="frame6_polling"></p>
          <button id="render-deploy-check-again-submit" type="button" data-i18n="check_again_button" style="display: none;"></button>
        </div>
        <div id="render-deploy-done-section" style="display: none;">
          <p data-i18n="frame6_done"></p>
          <a id="render-deploy-service-link" href="#" target="_blank" rel="noopener"></a>
        </div>
        <p id="render-deploy-error" class="frame-error"></p>
      </div>
    </details>
  </main>

<script>
  // Derived from the page's own origin, never templated in from an env var.
  // A hand-set PUBLIC_BASE_URL is a second source of truth for something the
  // browser already knows exactly, and the two drift: one differing by a
  // trailing slash was enough to break the Supabase OAuth leg outright.
  // location.origin is already normalised (scheme + host + port, no trailing
  // slash), and it is by definition the origin GitHub and Supabase will be
  // redirecting back to.
  window.ONBOARDING_BASE_URL = location.origin;
  window.SUPABASE_OAUTH_REDIRECT_URI = `${location.origin}/oauth/supabase/callback`;
  window.SUPABASE_OAUTH_CLIENT_ID = "__SUPABASE_OAUTH_CLIENT_ID__";

      err_render_deploy_canceled: "A newer deploy superseded this one. Click Deploy to check the latest status.",
      err_render_deploy_timeout: "Still deploying after 15 minutes. It may still finish — check again.",
      validate_button: "Validate",
      change_button: "Change",
      badge_locked: "Locked", badge_ready: "Not started",

  const THEME_ICON = { light: "☀️", dark: "🌙", system: "🖥️" };
  const LANG_LABEL = { en: "🇺🇸 English", he: "🇮🇱 עברית" };

  const KNOWN_LANGS = ["en", "he"];
  const KNOWN_THEMES = ["light", "dark", "system"];

  function readStoredLang() {
    const stored = localStorage.getItem("onboarding_lang");
    return KNOWN_LANGS.includes(stored) ? stored : "en";
  }

  function readStoredTheme() {
    const stored = localStorage.getItem("onboarding_theme");
    return KNOWN_THEMES.includes(stored) ? stored : "system";
  }

  let currentLang = readStoredLang();
  let currentTheme = readStoredTheme();

  function t(key) {
    return STRINGS[currentLang][key] || STRINGS.en[key] || key;
  }

  function applyTheme(theme) {
    currentTheme = theme;
    localStorage.setItem("onboarding_theme", theme);
    document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
    document.getElementById("themeToggleBtn").textContent = `${THEME_ICON[theme]} ${t("theme_" + theme)}`;
    document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
  }

  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("onboarding_lang", lang);
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
    document.title = t("page_title");
    document.getElementById("langToggleBtn").textContent = LANG_LABEL[lang];
    document.querySelectorAll("[data-i18n]").forEach((el) => {

    setDashboardAuthPasswordVisibility(dashboardAuthPasswordVisible);
    if (currentRenderDeployErrorKey) {
      document.getElementById("render-deploy-error").textContent = t(currentRenderDeployErrorKey);
    }
    if (currentGithubAppErrorKey) {
      document.getElementById("github-app-error").textContent = t(currentGithubAppErrorKey);
    }
    if (currentSupabaseErrorKey) {
      document.getElementById("supabase-error").textContent = t(currentSupabaseErrorKey);
    }
    if (currentLlmProviderErrorKey) {
      document.getElementById("llm-provider-error").textContent = t(currentLlmProviderErrorKey);
    }
    if (currentUptimePingerErrorKey) {
      document.getElementById("uptime-pinger-error").textContent = t(currentUptimePingerErrorKey);
    }
    applyTheme(currentTheme);
  }

  const STORAGE_KEYS = {
    "render-key": "onboarding.renderApiKey",
    "render-service": "onboarding.renderService",
    "dashboard-auth": "onboarding.dashboardAuth",
    "github-app": "onboarding.githubApp",
    "supabase": "onboarding.supabase",
    "llm-provider": "onboarding.llmProvider",
    "uptime-pinger": "onboarding.uptimeRobot",
  };

  // Written by sub-project 6 on its own completion (not yet built) --
  // frame 5 only ever reads this key, never writes it. See
  // docs/superpowers/specs/2026-08-27-onboarding-uptimerobot-frame-design.md
  // section 3's forward contract.
  const RENDER_SERVICE_URL_KEY = "onboarding.renderServiceUrl";

  const SUPABASE_PENDING_KEY = "onboarding.supabasePending";

  // Never JSON.parse this key's value directly: a corrupted/foreign-shaped
  // stored value would throw out of whatever handler read it (including
  // DOMContentLoaded, taking every later listener with it). Same defensive
  // read-then-validate shape as readStoredLang/readStoredTheme above.
  function readStoredGithubApp() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["github-app"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // Same defensive shape as readStoredGithubApp() above, for frame 3's
  // sessionStorage key — a corrupted/foreign-shaped stored value must never
  // throw out of a handler (including DOMContentLoaded, which would take
  // every later listener with it).
  function readStoredSupabase() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["supabase"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // Same defensive shape as readStoredGithubApp()/readStoredSupabase() above.
  function readStoredRenderService() {
    try {
      return JSON.parse(sessionStorage.getItem(STORAGE_KEYS["render-service"]) || "null");
    } catch (err) {
      return null;
    }
  }

  // SOURCE OF TRUTH: scripts/create_github_app.py's MANIFEST_PERMISSIONS /
  // MANIFEST_EVENTS. These two lists must stay identical — the CLI script and
  // this wizard create the same App. Change them there first, then here;
  // tests/test_onboarding_page.py::test_manifest_permissions_match_the_cli_script
  // imports the Python constants and fails if these drift.
  const MANIFEST_PERMISSIONS = {
    pull_requests: "write", contents: "read", issues: "write", metadata: "read",
  };
  const MANIFEST_EVENTS = ["pull_request"];
  const GITHUB_MANIFEST_STATE_KEY = "onboarding.githubManifestState";

  const FRAME_ORDER = [
    "render-key", "render-service", "dashboard-auth", "github-app", "supabase",
    "llm-provider", "uptime-pinger", "render-deploy",
  ];

  const frameState = {};
  FRAME_ORDER.forEach((id) => { frameState[id] = {status: "locked", detailKey: null, detailValue: null}; });
  frameState["render-key"].status = "ready";

  let currentRenderKeyErrorKey = null;
  let currentGithubAppErrorKey = null;
  let currentSupabaseErrorKey = null;
  let currentDashboardAuthErrorKey = null;
  let dashboardAuthPasswordVisible = false;

  // Bumped every time the Supabase frame is reset (lockFrame, beginChange,
  // or a terminal error) -- a poll started before the bump checks its
  // captured value against the current one and stops applying results if
  // they've diverged, instead of a stale setTimeout callback overwriting a
  // freshly reset frame's state after the visitor changed an upstream
  // frame mid-poll.
  let supabasePollGeneration = 0;
  // Same pattern as supabasePollGeneration above, for the render-deploy
  // frame's own poll loop.
  let renderDeployPollGeneration = 0;

  function frameEl(id) {
    return document.getElementById(`frame-${id}`);
  }

  function badgeEl(id) {
    return frameEl(id).querySelector(".frame-badge");
  }

  function detailEl(id) {
    return frameEl(id).querySelector(".frame-detail");
  }

  function renderBadge(id) {
    const {status, detailKey, detailValue} = frameState[id];
    const label = t("badge_" + status);
    // t() falls back to returning its input unchanged when it isn't a known
    // STRINGS key (see t()'s own `|| key` fallback), so resolving detailValue
    // through it here is safe for every existing caller that passes raw,
    // non-translatable text (a URL, an owner/account/project name) -- only a
    // detailValue that is itself a STRINGS key (e.g. a provider label key)
    // gets translated, and it re-resolves on every render, including after a
    // language switch.
    const detail = detailKey ? `${t(detailKey)}${detailValue ? t(detailValue) : ""}` : "";
    // Split across two elements, not one: the short label stays in the top
    // row next to the title and Change button, while the detail (which can
    // be arbitrarily long -- a URL, an owner name) renders on its own line
    // below via .frame-detail's flex-basis: 100%, instead of wrapping inline
    // and pushing the Change button down with it.
    badgeEl(id).textContent = label;
    detailEl(id).textContent = detail ? `— ${detail}` : "";
  }

  function refreshFrameBadges() {
    FRAME_ORDER.forEach(renderBadge);
  }

  function setFrameStatus(id, status, detailKey, detailValue) {
    frameState[id] = {status, detailKey: detailKey || null, detailValue: detailValue ?? null};
    frameEl(id).dataset.status = status;
    renderBadge(id);
  }

  function nextFrame(id) {
    return FRAME_ORDER[FRAME_ORDER.indexOf(id) + 1];
  }

  function lockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, "locked");
    const key = STORAGE_KEYS[id];
    if (key) sessionStorage.removeItem(key);
    // Frame 2's create/install sections are a one-way toggle otherwise: the
    // storage clear above would leave "Install App" on screen with nothing
    // behind it, and clicking it would report a misleading GitHub error.
    // Frame 3's connect/org-picker/provisioning sections are the same
    // shape, one step longer.
    if (id === "dashboard-auth") resetDashboardAuthSection();
    if (id === "github-app") resetGithubAppCreateSection();
    if (id === "supabase") resetSupabaseConnectSection();
    if (id === "llm-provider") resetLlmProviderSection();
    if (id === "uptime-pinger") resetUptimePingerSection();
    if (id === "render-deploy") resetRenderDeploySection();
    if (id === "render-service") {
      sessionStorage.removeItem(RENDER_SERVICE_URL_KEY);
      document.getElementById("render-service-submit").disabled = false;
    }
  }

  function unlockFrame(id) {
    const el = frameEl(id);
    el.dataset.locked = "false";
    setFrameStatus(id, "ready");
    if (id === "uptime-pinger") refreshUptimePingerBlockedState();
    if (id === "render-service") prefillRenderServiceDefaults();
  }

  function relockDownstreamOf(id) {
    FRAME_ORDER.slice(FRAME_ORDER.indexOf(id) + 1).forEach(lockFrame);
  }

  function completeFrame(id, detailKey, detailValue, status) {
    const el = frameEl(id);
    el.dataset.locked = "true";
    el.open = false;
    setFrameStatus(id, status || "done", detailKey, detailValue);
    const next = nextFrame(id);
    if (next) unlockFrame(next);
  }

  // Best-effort cleanup for an UptimeRobot monitor left watching a Render
  // service URL that's about to stop existing. Only render-key and
  // render-service changes can invalidate render-service's URL (every
  // other frame's "Change" leaves it alone) -- called from beginChange
  // BEFORE relockDownstreamOf runs, since that clears the uptime-pinger
  // frame's own sessionStorage record (including this monitor_id) as part
  // of locking it. Reads synchronously before its first await, so the call
  // site doesn't need to await this itself for the read to be safe.
  async function cleanupOrphanedUptimeMonitor() {
    let stored;
    try {
      stored = JSON.parse(sessionStorage.getItem(STORAGE_KEYS["uptime-pinger"]) || "null");
    } catch (err) {
      return;
    }
    if (!stored || !stored.api_key || !stored.monitor_id) return;
    try {
      const resp = await fetch("/api/uptimerobot/delete-monitor", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: stored.api_key, monitor_id: stored.monitor_id}),
      });
      const body = await resp.json();
      if (!body.valid) {
        console.warn("UptimeRobot monitor cleanup failed:", "/api/uptimerobot/delete-monitor", "reason:", body.reason);
      }
    } catch (err) {
      // best-effort -- same failure handling as the push-and-clear helpers
      // above (e.g. pushGithubAppToRenderService): a network failure here
      // never blocks the frame change it was triggered by.
      console.warn("UptimeRobot monitor cleanup failed:", "/api/uptimerobot/delete-monitor", "network error");
    }
  }

  function beginChange(id) {
    if (id === "render-key" || id === "render-service") {
      cleanupOrphanedUptimeMonitor();
    }
    relockDownstreamOf(id);
    const el = frameEl(id);
    el.dataset.locked = "false";
    el.open = true;
    setFrameStatus(id, "ready");
    // relockDownstreamOf only clears *later* frames' storage, so a frame
    // changing itself must clear its own stale value here too — otherwise a
    // mid-change refresh would silently re-complete it from stale
    // sessionStorage. Every frame below clears its own key on self-change
    // for exactly this reason.
    if (id === "render-key") {
      sessionStorage.removeItem(STORAGE_KEYS["render-key"]);
      document.getElementById("render-key-submit").disabled = false;
    }
    if (id === "render-service") {
      sessionStorage.removeItem(STORAGE_KEYS["render-service"]);
      sessionStorage.removeItem(RENDER_SERVICE_URL_KEY);
      document.getElementById("render-service-name-input").value = "";
      document.getElementById("render-service-submit").disabled = false;
      prefillRenderServiceDefaults();
    }
    if (id === "dashboard-auth") {
      sessionStorage.removeItem(STORAGE_KEYS["dashboard-auth"]);
      resetDashboardAuthSection();
    }
    if (id === "github-app") {
      sessionStorage.removeItem(STORAGE_KEYS["github-app"]);
      resetGithubAppCreateSection();
    }
    if (id === "supabase") {
      sessionStorage.removeItem(STORAGE_KEYS["supabase"]);
      resetSupabaseConnectSection();
    }
    if (id === "llm-provider") {
      sessionStorage.removeItem(STORAGE_KEYS["llm-provider"]);
      resetLlmProviderSection();
    }
    if (id === "uptime-pinger") {
      sessionStorage.removeItem(STORAGE_KEYS["uptime-pinger"]);
      resetUptimePingerSection();
    }
  }

  let currentLlmProviderErrorKey = null;
  let pendingLlmProviderCredential = null;

  function resetLlmProviderSection() {
    document.querySelectorAll('input[name="llm-provider-choice"]').forEach((r) => { r.checked = false; });
    const apiKeyInput = document.getElementById("llm-provider-api-key-input");
    apiKeyInput.value = "";
    apiKeyInput.style.display = "none";
    const fileInput = document.getElementById("llm-provider-file-input");
    fileInput.value = "";
    fileInput.style.display = "none";
    document.getElementById("llm-provider-validate-submit").style.display = "none";
    document.getElementById("llm-provider-validate-submit").disabled = false;
    document.getElementById("llm-provider-continue-submit").disabled = false;
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    pendingLlmProviderCredential = null;
  }

  function llmProviderError(key) {
    setFrameStatus("llm-provider", "error");
    document.getElementById("llm-provider-validate-submit").disabled = false;
    currentLlmProviderErrorKey = key;
    document.getElementById("llm-provider-error").textContent = t(key);
  }

  function llmProviderErrorForReason(reason) {
    const map = {
      unauthorized: "err_llm_unauthorized",
      forbidden: "err_llm_forbidden",
      rate_limited: "err_llm_rate_limited",
      provider_unreachable: "err_llm_unreachable",
      invalid_service_account_json: "err_llm_invalid_service_account_json",
    };
    llmProviderError(map[reason] || "err_llm_unreachable");
  }

  function getSelectedLlmProvider() {
    const checked = document.querySelector('input[name="llm-provider-choice"]:checked');
    return checked ? checked.value : null;
  }

  function handleLlmProviderChoice() {
    const provider = getSelectedLlmProvider();
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    pendingLlmProviderCredential = null;
    const apiKeyInput = document.getElementById("llm-provider-api-key-input");
    const fileInput = document.getElementById("llm-provider-file-input");
    const submitBtn = document.getElementById("llm-provider-validate-submit");
    apiKeyInput.value = "";
    fileInput.value = "";
    apiKeyInput.style.display = (provider === "gemini" || provider === "groq") ? "block" : "none";
    fileInput.style.display = (provider === "vertex") ? "block" : "none";
    submitBtn.style.display = provider ? "block" : "none";
  }

  function showLlmProviderModels(models, provider, credentialFragment, projectId) {
    const select = document.getElementById("llm-provider-model-select");
    select.innerHTML = "";
    if (!models.length) {
      llmProviderError("err_llm_no_models_available");
      return;
    }
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = t("frame4_model_placeholder");
    placeholder.disabled = true;
    placeholder.selected = true;
    select.appendChild(placeholder);
    models.forEach((m) => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      select.appendChild(opt);
    });
    document.getElementById("llm-provider-model-section").style.display = "block";
    pendingLlmProviderCredential = {
      provider,
      ...credentialFragment,
      ...(projectId ? {gcp_project: projectId} : {}),
    };
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        const commaIdx = result.indexOf(",");
        resolve(commaIdx >= 0 ? result.slice(commaIdx + 1) : result);
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function base64ToJsonSanityCheck(b64) {
    try {
      const decoded = atob(b64);
      JSON.parse(decoded);
      return true;
    } catch (err) {
      return false;
    }
  }

  async function validateLlmProviderCredential() {
    const provider = getSelectedLlmProvider();
    document.getElementById("llm-provider-error").textContent = "";
    currentLlmProviderErrorKey = null;
    document.getElementById("llm-provider-model-section").style.display = "none";
    document.getElementById("llm-provider-model-select").innerHTML = "";
    pendingLlmProviderCredential = null;
    if (!provider) {
      llmProviderError("err_llm_no_provider");
      return;
    }
    let endpoint, payload, credentialFragment;
    if (provider === "gemini") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/gemini/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else if (provider === "groq") {
      const apiKey = document.getElementById("llm-provider-api-key-input").value.trim();
      if (!apiKey) {
        llmProviderError("err_llm_empty_key");
        return;
      }
      endpoint = "/api/llm/groq/list-models";
      payload = {api_key: apiKey};
      credentialFragment = {api_key: apiKey};
    } else {
      const fileInput = document.getElementById("llm-provider-file-input");
      const file = fileInput.files[0];
      if (!file) {
        llmProviderError("err_llm_no_file");
        return;
      }
      let b64;
      try {
        b64 = await readFileAsBase64(file);
      } catch (err) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      if (!(await base64ToJsonSanityCheck(b64))) {
        llmProviderError("err_llm_invalid_service_account_json");
        return;
      }
      endpoint = "/api/llm/vertex/list-models";
      payload = {service_account_key_b64: b64};
      credentialFragment = {gcp_service_account_key_b64: b64};
    }
    setFrameStatus("llm-provider", "checking");
    document.getElementById("llm-provider-validate-submit").disabled = true;
    let resp;
    try {
      resp = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
    } catch (err) {
      llmProviderError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      llmProviderError("err_llm_unreachable");
      return;
    }
    if (!body.valid) {
      llmProviderErrorForReason(body.reason);
      return;
    }
    showLlmProviderModels(body.models, provider, credentialFragment, body.project_id);
  }

  async function pushLlmProviderToRenderService(stored) {
    const renderService = readStoredRenderService();
    const renderApiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!renderService || !renderService.service_id || !renderApiKey) return;
    const credentialValue = stored.provider === "vertex"
      ? stored.gcp_service_account_key_b64
      : stored.api_key;
    try {
      const resp = await fetch("/api/llm/push-render-vars", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          render_api_key: renderApiKey,
          render_service_id: renderService.service_id,
          provider: stored.provider,
          credential_value: credentialValue,
          model: stored.model,
        }),
      });
      const body = await resp.json();
      if (!body.valid) {
        console.warn("Render push failed:", "/api/llm/push-render-vars", "reason:", body.reason, "pushed:", body.pushed);
      }
    } catch (err) {
      // best-effort -- a network failure still counts as "attempted"
      // (design spec section 5b step 8); the fields below are cleared
      // either way, and this frame's completion is never gated on it.
      console.warn("Render push failed:", "/api/llm/push-render-vars", "network error");
    }
    delete stored.api_key;
    delete stored.gcp_service_account_key_b64;
  }

  const LLM_PROVIDER_LABEL_KEY = {
    gemini: "frame4_provider_gemini",
    groq: "frame4_provider_groq",
    vertex: "frame4_provider_vertex",
  };

  async function confirmLlmProviderModel() {
    const select = document.getElementById("llm-provider-model-select");
    const model = select.value;
    if (!model || !pendingLlmProviderCredential) {
      llmProviderError("err_llm_no_model_selected");
      return;
    }
    const continueBtn = document.getElementById("llm-provider-continue-submit");
    continueBtn.disabled = true;
    const stored = {...pendingLlmProviderCredential, model};
    await pushLlmProviderToRenderService(stored);
    try {
      sessionStorage.setItem(STORAGE_KEYS["llm-provider"], JSON.stringify(stored));
    } catch (err) {
      continueBtn.disabled = false;
      llmProviderError("err_llm_storage_failed");
      return;
    }
    // Pass the STRINGS key (not pre-resolved text) as the detail value:
    // renderBadge() resolves it through t() at render time, the same way
    // detailKey already does, so the label re-translates on a later
    // language switch instead of freezing in whatever language was active
    // when the frame completed.
    completeFrame("llm-provider", "provider_prefix", LLM_PROVIDER_LABEL_KEY[stored.provider] || stored.provider);
  }

  let currentUptimePingerErrorKey = null;

  function refreshUptimePingerBlockedState() {
    const hasRenderUrl = !!sessionStorage.getItem(RENDER_SERVICE_URL_KEY);
    document.getElementById("uptime-pinger-blocked-section").style.display = hasRenderUrl ? "none" : "block";
    document.getElementById("uptime-pinger-form-section").style.display = hasRenderUrl ? "block" : "none";
  }

  function resetUptimePingerSection() {
    document.getElementById("uptime-pinger-api-key-input").value = "";
    document.getElementById("uptime-pinger-error").textContent = "";
    document.getElementById("uptime-pinger-submit").disabled = false;
    currentUptimePingerErrorKey = null;
    refreshUptimePingerBlockedState();
  }

  async function submitUptimeRobotKey() {
    const input = document.getElementById("uptime-pinger-api-key-input");
    const key = input.value.trim();
    const errorEl = document.getElementById("uptime-pinger-error");
    errorEl.textContent = "";
    currentUptimePingerErrorKey = null;
    if (!key) {
      currentUptimePingerErrorKey = "err_uptime_empty_key";
      errorEl.textContent = t("err_uptime_empty_key");
      return;
    }
    const renderServiceUrl = sessionStorage.getItem(RENDER_SERVICE_URL_KEY);
    if (!renderServiceUrl) {
      refreshUptimePingerBlockedState();
      return;
    }
    setFrameStatus("uptime-pinger", "checking");
    const submitBtn = document.getElementById("uptime-pinger-submit");
    submitBtn.disabled = true;
    let resp;
    try {
      resp = await fetch("/api/uptimerobot/create-monitor", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: key, render_service_url: renderServiceUrl}),
      });
    } catch (err) {
      submitBtn.disabled = false;
      setFrameStatus("uptime-pinger", "error");
      currentUptimePingerErrorKey = "err_network";
      errorEl.textContent = t("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      submitBtn.disabled = false;
      setFrameStatus("uptime-pinger", "error");
      currentUptimePingerErrorKey = "err_uptime_unreachable";
      errorEl.textContent = t("err_uptime_unreachable");
      return;
    }
    if (body.valid) {
      sessionStorage.setItem(STORAGE_KEYS["uptime-pinger"], JSON.stringify({api_key: key, monitor_id: body.monitor_id}));
      input.value = "";
      completeFrame("uptime-pinger", body.created ? "monitor_created_detail" : "monitor_reused_detail", null);
    } else {
      submitBtn.disabled = false;
      setFrameStatus("uptime-pinger", "error");
      currentUptimePingerErrorKey = uptimePingerErrorKeyForReason(body.reason);
      errorEl.textContent = t(currentUptimePingerErrorKey);
    }
  }

  function uptimePingerErrorKeyForReason(reason) {
    const map = {
      unauthorized: "err_uptime_unauthorized",
      rate_limited: "err_uptime_rate_limited",
      provider_unreachable: "err_uptime_unreachable",
      request_rejected: "err_uptime_request_rejected",
    };
    return map[reason] || "err_uptime_unreachable";
  }

  let currentRenderServiceErrorKey = null;

    return `pr-review-bot-${hex}`;

  async function createRenderService() {
    const repoInput = document.getElementById("render-service-repo-input");
    const nameInput = document.getElementById("render-service-name-input");
    const errorEl = document.getElementById("render-service-error");
    errorEl.textContent = "";
    currentRenderServiceErrorKey = null;
    const repoUrl = repoInput.value.trim();
    const name = nameInput.value.trim();
    const apiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!apiKey) {
      currentRenderServiceErrorKey = "err_render_service_no_key";
      errorEl.textContent = t("err_render_service_no_key");
      return;
    }
    if (!repoUrl || !name) {
      currentRenderServiceErrorKey = "err_render_service_empty";

      return;

    setFrameStatus("render-service", "checking");
    const submitBtn = document.getElementById("render-service-submit");
    submitBtn.disabled = true;
    let resp;
    try {
      resp = await fetch("/api/render/create-service", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({api_key: apiKey, repo_url: repoUrl, name: name}),
      });
    } catch (err) {
      submitBtn.disabled = false;
      setFrameStatus("render-service", "error");
      currentRenderServiceErrorKey = "err_network";
      errorEl.textContent = t("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      submitBtn.disabled = false;
      setFrameStatus("render-service", "error");
      currentRenderServiceErrorKey = "err_render_service_unreachable";
      errorEl.textContent = t("err_render_service_unreachable");
      return;
    }

      sessionStorage.setItem(STORAGE_KEYS["render-service"], JSON.stringify({

      }));
      sessionStorage.setItem(RENDER_SERVICE_URL_KEY, body.service_url);

      errorEl.textContent = t("err_render_service_invalid_key");

      submitBtn.disabled = false;
      setFrameStatus("render-service", "error");
      currentRenderServiceErrorKey = "err_render_service_rejected";
      errorEl.textContent = body.message
        ? `${t("err_render_service_rejected")} ${body.message}`
        : t("err_render_service_rejected");
    } else {
      submitBtn.disabled = false;
      setFrameStatus("render-service", "error");
      currentRenderServiceErrorKey = "err_render_service_unreachable";
      errorEl.textContent = t("err_render_service_unreachable");
    }
  }

  function generateDashboardAuthPassword() {
    const bytes = crypto.getRandomValues(new Uint8Array(15));
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  // 32 random bytes, base64url-encoded -- comfortably over app/main.py's own
  // `len(dashboard_session_secret) >= 32` boot guard. Never shown to the
  // visitor (unlike username/password): nothing downstream ever asks them
  // to type it again.
  function generateDashboardAuthSessionSecret() {
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function setDashboardAuthPasswordVisibility(visible) {

  // Best-effort push, same shape as pushLlmProviderToRenderService: a
  // failure (network or otherwise) is logged, never blocks this frame's own
  // completion (root CLAUDE.md / onboarding/CLAUDE.md's push-and-clear
  // convention). Unlike every other frame, the raw values here are never
  // written to sessionStorage at all -- they live only in this function's
  // and submitDashboardAuth's local variables, so there is nothing to
  // "clear" afterward.
  async function pushDashboardAuthToRenderService(username, password, sessionSecret) {
    const renderService = readStoredRenderService();
    const renderApiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!renderService || !renderService.service_id || !renderApiKey) return;
    try {
      const resp = await fetch("/api/dashboard-auth/push-render-vars", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          render_api_key: renderApiKey,
          render_service_id: renderService.service_id,
          username, password, session_secret: sessionSecret,
        }),
      });
      const body = await resp.json();
      if (!body.valid) {
        console.warn("Render push failed:", "/api/dashboard-auth/push-render-vars", "reason:", body.reason, "pushed:", body.pushed);
      }
    } catch (err) {
      console.warn("Render push failed:", "/api/dashboard-auth/push-render-vars", "network error");
    }
  }

  async function submitDashboardAuth() {
    const usernameInput = document.getElementById("dashboard-auth-username-input");
    const passwordInput = document.getElementById("dashboard-auth-password-input");
    const ackCheckbox = document.getElementById("dashboard-auth-ack-checkbox");
    const errorEl = document.getElementById("dashboard-auth-error");
    errorEl.textContent = "";
    currentDashboardAuthErrorKey = null;
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_empty";
      errorEl.textContent = t("err_dashboard_auth_empty");
      return;
    }
    if (password.length < 8) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_password_short";
      errorEl.textContent = t("err_dashboard_auth_password_short");
      return;
    }
    if (!ackCheckbox.checked) {
      currentDashboardAuthErrorKey = "err_dashboard_auth_ack_required";
      errorEl.textContent = t("err_dashboard_auth_ack_required");
      return;
    }
    const submitBtn = document.getElementById("dashboard-auth-submit");
    submitBtn.disabled = true;
    const sessionSecret = generateDashboardAuthSessionSecret();
    await pushDashboardAuthToRenderService(username, password, sessionSecret);
    try {
      sessionStorage.setItem(STORAGE_KEYS["dashboard-auth"], JSON.stringify({completed: true}));
    } catch (err) {
      submitBtn.disabled = false;
      currentDashboardAuthErrorKey = "err_dashboard_auth_storage_failed";
      errorEl.textContent = t("err_dashboard_auth_storage_failed");
      return;
    }
    completeFrame("dashboard-auth", null, null);
  }

  function buildManifest(appName, webhookUrl) {

      hook_attributes: {url: webhookUrl, active: true},

    }
    // Hard precondition now that the webhook URL is baked into the manifest
    // rather than patched in afterwards: without it we would mint an App
    // permanently pointed at nothing. The manifest code is single-use, so
    // there is no second chance to fix it -- refuse up front instead.
    // Unreachable in normal sequential flow (the Render-service frame
    // completes two frames earlier); this guards the same corrupted /
    // hand-edited sessionStorage case the UptimeRobot frame's own
    // blocked-state check exists for.
    const renderService = readStoredRenderService();
    if (!renderService || !renderService.service_url) {
      githubAppError("err_github_no_render_service");
      return;

    const state = crypto.randomUUID();

  async function handleGithubManifestCallback() {
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "manifest") return;
    history.replaceState(null, "", location.pathname);
    const expectedState = sessionStorage.getItem(GITHUB_MANIFEST_STATE_KEY);
    sessionStorage.removeItem(GITHUB_MANIFEST_STATE_KEY);
    const code = params.get("code");
    if (!expectedState || params.get("state") !== expectedState || !code) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    let resp;
    try {
      resp = await fetch("/api/github/exchange-manifest-code", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({code: code}),
      });
    } catch (err) {
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify({
        app_id: body.app_id, slug: body.slug,
        private_key_b64: body.private_key_b64, webhook_secret: body.webhook_secret,
      }));
      showGithubAppReadyToInstall();
    } else if (body.reason === "exchange_failed") {
      githubAppError("err_github_exchange_failed");
    } else {
      githubAppError("err_github_unreachable");
    }
  }

  async function pushGithubAppToRenderService(stored) {
    const renderService = readStoredRenderService();
    const renderApiKey = sessionStorage.getItem(STORAGE_KEYS["render-key"]);
    if (!renderService || !renderService.service_id || !renderApiKey) return;
    try {
      const resp = await fetch("/api/github/push-render-vars", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          render_api_key: renderApiKey,
          render_service_id: renderService.service_id,
          app_id: stored.app_id,
          private_key_b64: stored.private_key_b64,
          webhook_secret: stored.webhook_secret,
          installation_id: stored.installation_id,
        }),
      });
      const body = await resp.json();
      if (!body.valid) {
        console.warn("Render push failed:", "/api/github/push-render-vars", "reason:", body.reason, "pushed:", body.pushed);
      }
    } catch (err) {
      // best-effort -- a network failure still counts as "attempted"
      // (design spec section 5b step 8); the fields below are cleared
      // either way, and this frame's completion is never gated on it.
      console.warn("Render push failed:", "/api/github/push-render-vars", "network error");
    }
    delete stored.private_key_b64;
    delete stored.webhook_secret;
  }

  async function finishGithubAppSetup(stored, accountLogin) {
    // No webhook-correction step: the App was created already pointing at
    // the right URL (see buildManifest), so all that is left is the
    // best-effort push-and-clear every other frame does.
    await pushGithubAppToRenderService(stored);
    // Explicit flag, not inferred from installation_id's mere presence --
    // that field is written earlier (markGithubAppInstalled, before
    // this function even runs) and would otherwise make restoreFromSession()
    // treat an interrupted push-and-clear as a completed frame on reload.
    // Same pattern as the Supabase frame's own `completed` flag.
    stored.completed = true;
    sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify(stored));
    completeFrame("github-app", "account_prefix", accountLogin);
  }

  async function markGithubAppInstalled() {
    // The wizard offers no install link, no address, not even copyable text.
    // Five separate throwaway GitHub accounts were suspended for a ToS
    // violation at this step: three via an automatic location.href redirect,
    // one via an <a> carrying rel="noreferrer"/referrerpolicy="no-referrer",
    // and one via the visitor pasting the URL into their own address bar.
    // Reaching /installations/new by any route other than navigating inside
    // GitHub itself is what appears to trip it, so the wizard stops
    // supplying a route and only says where to go. See ISSUES.md.
    //
    // Since the install happens somewhere this page cannot observe, the
    // visitor reports the installation id themselves. It is never taken on
    // trust: the relay checks it against the App's own JWT, and the frame
    // stays locked unless that check passes.
    const stored = readStoredGithubApp();
    if (!stored || !stored.app_id || !stored.private_key_b64) {
      githubAppError("err_github_callback_invalid");
      return;
    }
    const input = document.getElementById("github-app-installation-id-input");
    const raw = input.value.trim();
    document.getElementById("github-app-error").textContent = "";
    currentGithubAppErrorKey = null;
    // Checked before the call so an empty or mistyped box is an immediate,
    // specific message rather than a round trip ending in a generic 404.
    if (!/^[0-9]+$/.test(raw) || Number(raw) <= 0) {
      githubAppError("err_github_installation_id_invalid");
      return;
    }
    const installationId = Number(raw);
    const btn = document.getElementById("github-app-install-submit");
    btn.disabled = true;
    let resp;
    try {
      resp = await fetch("/api/github/verify-installation", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          app_id: stored.app_id,
          private_key_b64: stored.private_key_b64,
          installation_id: installationId,
        }),
      });
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_network");
      return;
    }
    let body;
    try {
      if (!resp.ok) throw new Error("bad status");
      body = await resp.json();
    } catch (err) {
      btn.disabled = false;
      githubAppError("err_github_unreachable");
      return;
    }
    if (body.valid) {
      stored.installation_id = installationId;
      stored.account_login = body.account_login;
      sessionStorage.setItem(STORAGE_KEYS["github-app"], JSON.stringify(stored));
      await finishGithubAppSetup(stored, body.account_login);
      return;
    }
    btn.disabled = false;
    if (body.reason === "installation_not_found") {
      githubAppError("err_github_installation_not_found");
    } else if (body.reason === "invalid_credentials") {
      githubAppError("err_github_invalid_credentials");
    } else {
      githubAppError("err_github_unreachable");
    }
  }

  function handleGithubInstallReturn() {
    // GitHub sends the visitor back to the App's setup_url after an install,
    // including when they installed from GitHub's own UI, so this spares
    // them copying the id by hand. It only ever pre-fills the box: the value
    // still goes through the same verification as a typed one, which is what
    // GitHub's setup-URL docs require (they warn this parameter can be
    // spoofed). A visitor who installed in another tab, or who never gets
    // redirected, just types the id and clicks the button instead.
    const params = new URLSearchParams(location.search);
    if (params.get("gh_step") !== "install") return;
    history.replaceState(null, "", location.pathname);
    if (!readStoredGithubApp()) return;
    const supplied = params.get("installation_id") || "";
    if (!/^[0-9]+$/.test(supplied)) return;
    document.getElementById("github-app-installation-id-input").value = supplied;
    markGithubAppInstalled();
  }

  function base64UrlEncode(bytes) {
    let binary = "";
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function generatePkcePair() {
    const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
    const verifier = base64UrlEncode(verifierBytes);
    const challengeBuffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const challenge = base64UrlEncode(new Uint8Array(challengeBuffer));
    return {verifier, challenge};
  }

  function generateDbPassword() {
    const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const bytes = crypto.getRandomValues(new Uint8Array(32));
    let password = "";
    bytes.forEach((b) => { password += charset[b % charset.length]; });
    return password;
  }

  function supabaseError(key) {
    setFrameStatus("supabase", "error");
    currentSupabaseErrorKey = key;
    document.getElementById("supabase-error").textContent = t(key);
