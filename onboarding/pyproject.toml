[project]
name = "onboarding"
version = "0.1.0"
description = "Self-service setup wizard: provisions a visitor's own bot+dashboard deployment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pygithub>=2.4",
    "google-genai>=0.3",
    "httpx>=0.27",
    "groq>=1.5.0",
    "google-auth>=2.35",
    "pyjwt>=2.13",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
]

[tool.uv]
package = false
