services:
  - type: web
    name: pr-review-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TARGET_REPO
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: VERTEX_MODEL
        sync: false
      - key: GCP_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GCP_SERVICE_ACCOUNT_KEY_1
        sync: false
      - key: GCP_SERVICE_ACCOUNT_KEY_2
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GCP_LOCATION
        sync: false
      - key: DISPATCHER_REREVIEW_COOLDOWN_SECONDS
        sync: false
      - key: DISPATCHER_REREVIEW_COOLDOWN_MAX_SECONDS
        sync: false
      - key: DISPATCHER_REREVIEW_COOLDOWN_FACTOR
        sync: false
      - key: KEY_USAGE_TOKEN_CAP
        sync: false
      - key: KEY_USAGE_COST_CAP_USD
        sync: false
      - key: KEY_USAGE_RESET_TIME_UTC
        sync: false
